<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include('shared-styles') ?>
  <style>
    :root { --main-max: 720px; }

    label { display: block; font-size: .85rem; font-weight: 700; margin: 0 0 6px; }
    input { width: 100%; }

    h2 { font-size: 1rem; margin: 0 0 4px; }
    .lead { font-size: .85rem; color: var(--text-muted); margin: 0 0 14px; line-height: 1.7; }

    /* 職員が管理する項目。編集できないことが見て分かるよう、入力欄ではなく定義リストで出す */
    .ro { display: grid; grid-template-columns: 108px 1fr; gap: 8px 12px; margin: 0; font-size: .95rem; }
    .ro dt { color: var(--text-muted); font-size: .85rem; }
    .ro dd { margin: 0; }
    .ro dd.empty { color: var(--text-faint); }

    .field { margin-bottom: 16px; }

    /* 対応できる業務。指で押せる大きさのトグルにする（チェックボックスだけだと狙いにくい） */
    .skills { display: flex; flex-wrap: wrap; gap: 10px; }
    .skill { display: inline-flex; align-items: center; gap: 8px; margin: 0;
             border: 1px solid var(--border-strong); border-radius: var(--radius);
             padding: 10px 16px; font-size: .95rem; cursor: pointer; background: var(--surface); }
    .skill:hover { background: var(--brand-soft); }
    .skill:has(input:checked) { border-color: var(--brand); background: var(--brand-soft);
                                color: var(--brand-ink); }
    .skill input { width: auto; }

    /* 空きコマの格子（曜日 × 時限）。自由入力にすると存在しないスロットが入りうるので選択式にする */
    .grid-wrap { overflow-x: auto; }
    table.slots { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 380px; }
    table.slots th, table.slots td { border-right: 1px solid var(--border);
                                     border-bottom: 1px solid var(--border); text-align: center; }
    table.slots tr > *:last-child { border-right: none; }
    table.slots thead th { background: var(--brand); color: #fff; padding: 7px 4px;
                           font-size: .88rem; font-weight: 600; border-color: var(--brand-dark); }
    table.slots .ph { background: var(--surface-alt); font-size: .82rem; font-weight: 600;
                      padding: 6px 8px; white-space: nowrap; text-align: right; }
    table.slots .ph small { display: block; color: var(--text-faint); font-weight: normal; font-size: .7rem; }
    table.slots td { padding: 0; }
    /* セル全体を押せるようにする（チェックボックスだけだと指で狙いにくい） */
    table.slots td label { display: block; margin: 0; padding: 10px 4px; cursor: pointer; }
    table.slots td label:hover { background: var(--brand-soft); }
    table.slots input { width: auto; }

    /* 業務の切り替えタブ。ページを分けると行き来に時間がかかるので、同じカード内で切り替える */
    .tabs { display: flex; gap: 6px; margin: 0 0 12px; border-bottom: 2px solid var(--border); }
    .tab { appearance: none; border: none; background: none; font-family: inherit;
           font-size: .92rem; font-weight: 700; color: var(--text-muted); cursor: pointer;
           padding: 9px 16px; border-bottom: 3px solid transparent; margin-bottom: -2px; }
    .tab:hover { color: var(--brand-ink); background: var(--brand-soft); }
    .tab.on { color: var(--brand-ink); border-bottom-color: var(--brand); }
    .tab .n { font-weight: normal; font-size: .82rem; color: var(--text-faint); margin-left: 5px; }
    .tab.on .n { color: var(--brand-ink); }
    .pane[hidden] { display: none; }
    .panenote { font-size: .8rem; color: var(--warn); margin: 0 0 10px; }

    .slotops { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .updated { font-size: .82rem; color: var(--text-muted); margin-top: 10px; }
    .toast { margin-top: 14px; display: none; }
    .toast.ok, .toast.err { display: block; }
    #save { margin-top: 4px; }
  </style>
</head>
<body>
  <?!= chrome ?>

  <main>
    <div id="body" class="state">読み込み中…</div>
  </main>

  <script>
    var P = null;   // getMyProfile の戻り

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function escapeAttr(s) {
      return escapeHtml(s).replace(/'/g, '&#39;').replace(/"/g, '&quot;');
    }
    function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }

    function render(p) {
      P = p;
      var host = document.getElementById('body');

      // ── 職員が管理する項目（読み取り専用）──
      var ro = function (label, value, note) {
        var v = value
          ? escapeHtml(value)
          : '<span class="empty">（未設定' + (note ? '・' + note : '') + '）</span>';
        return '<dt>' + label + '</dt><dd' + (value ? '' : ' class="empty"') + '>' + v + '</dd>';
      };
      var readOnly =
        '<div class="card">' +
        '<h2>あなたの情報</h2>' +
        '<p class="lead">ここは職員が管理します。変更が必要なときは職員へお伝えください。</p>' +
        '<dl class="ro">' +
          ro('氏名', p.name) +
          ro('区分', p.role) +
          ro('メール', p.email) +
        '</dl></div>';

      // ── 連絡先（本人が変更できる）──
      var contact =
        '<div class="card">' +
        '<h2>連絡先</h2>' +
        '<p class="lead">この2つは自分で変更できます。</p>' +
        '<div class="field"><label for="phone">電話番号</label>' +
          '<input id="phone" type="tel" placeholder="090-1234-5678" value="' + escapeAttr(p.phone) + '">' +
          '<p class="hint">返信が無いときに職員から連絡することがあります。</p></div>' +
        '<div class="field"><label for="webhook">Google Chat の通知先URL</label>' +
          '<input id="webhook" type="url" placeholder="https://chat.googleapis.com/..." value="'
            + escapeAttr(p.webhook_url) + '">' +
          '<p class="hint">代行依頼はここへ届きます。空にすると通知が届きません。' +
          '作り方は職員から配られた案内を参照してください。</p></div>' +
        '</div>';

      // ── 対応できる業務・空きコマ（学生のみ）──
      var skills = p.isStudent ? renderSkills(p) : '';
      var slots = p.isStudent ? renderSlots(p) : '';

      host.className = '';
      host.innerHTML = readOnly + contact + skills + slots +
        '<button class="btn primary block" id="save" onclick="save()">この内容で保存する</button>' +
        '<div id="toast" class="toast"></div>';
    }

    function renderSkills(p) {
      var chosen = {};
      (p.skillList || []).forEach(function (x) { chosen[x] = true; });
      // 保存済みが空欄＝D9 の「全対応」。初めて開いた人が何も選ばれていない画面を見て
      // そのまま保存すると弾かれるので、全対応は「両方にチェック」として見せる。
      var allRound = (p.skillList || []).length === 0;

      var boxes = (p.supportTypes || []).map(function (name) {
        var on = allRound || chosen[name];
        return '<label class="skill"><input type="checkbox" data-skill="' + escapeAttr(name) + '"'
          + (on ? ' checked' : '') + '>' + escapeHtml(name) + '</label>';
      }).join('');

      return '<div class="card"><h2>対応できる業務</h2>' +
        '<p class="lead">できるようになった業務・できなくなった業務を自分で変更できます。' +
        '<b>ここで選んだ内容の代行依頼だけが届きます。</b></p>' +
        '<div class="skills">' + boxes + '</div>' +
        '<p class="hint">研修を受けて対応できる業務が増えたときは、ここにチェックを足してください。' +
        '<b>1つ以上は選ぶ必要があります</b>（すべて外すと、逆にすべての依頼が届く扱いになるためです）。</p>' +
        '</div>';
    }

    function pickedSkills() {
      var out = [];
      document.querySelectorAll('input[data-skill]').forEach(function (b) {
        if (b.checked) out.push(b.getAttribute('data-skill'));
      });
      return out;
    }

    function renderSlots(p) {
      // 空きコマは業務ごとに別で持つ（D32）。ページを分けると行き来に時間がかかるので、
      // 1つのカードの中でタブを切り替える。保存は表示中のタブだけでなく全業務ぶんを送る。
      var types = p.supportTypes || [];
      var tabs = types.map(function (t, i) {
        var n = ((p.slotsByType && p.slotsByType[t]) || []).length;
        return '<button type="button" class="tab' + (i === 0 ? ' on' : '') + '"'
          + ' data-tab="' + escapeAttr(t) + '">' + escapeHtml(t)
          + '<span class="n" data-count="' + escapeAttr(t) + '">' + n + '</span></button>';
      }).join('');

      var panes = types.map(function (t, i) {
        return '<div class="pane" data-pane="' + escapeAttr(t) + '"'
          + (i === 0 ? '' : ' hidden') + '>' + slotGrid(p, t) + '</div>';
      }).join('');

      return '<div class="card"><h2>空きコマ</h2>' +
        '<p class="lead">授業が入っていない＝<b>代行に入れる可能性がある</b>コマにチェックしてください。' +
        'ここにチェックが無いコマの代行依頼は届きません。学期が変わったら出し直してください。</p>' +
        '<p class="lead"><b>テイクと介助は別々に登録します。</b>' +
        '業務によって空いている時間が違うためです。タブで切り替えてください。</p>' +
        '<div class="tabs">' + tabs + '</div>' + panes +
        '<div class="updated" id="updated">' + updatedText(p.slots_updated_at) + '</div>' +
        '</div>';
    }

    // 1つの業務ぶんの格子（曜日 × その業務で選べる時限）
    function slotGrid(p, type) {
      var chosen = {};
      (((p.slotsByType || {})[type]) || []).forEach(function (s) { chosen[s] = true; });
      var periods = (p.periods || []).filter(function (per) {
        return (per.supportTypes || []).indexOf(type) !== -1;
      });

      var h = '';
      // 対応できる業務から外している間は、入れても依頼は届かない。消しはしないが黙ってもいない。
      if ((p.skillList || []).length && p.skillList.indexOf(type) === -1) {
        h += '<p class="panenote">いまは「対応できる業務」で' + escapeHtml(type)
          + 'を選んでいないため、ここに入れても' + escapeHtml(type) + 'の依頼は届きません。</p>';
      }
      if (!periods.length) {
        return h + '<p class="lead">' + escapeHtml(type) + 'で選べる時限が登録されていません。</p>';
      }

      h += '<div class="grid-wrap"><table class="slots"><thead><tr><th class="ph"></th>';
      p.days.forEach(function (d) { h += '<th>' + escapeHtml(d) + '</th>'; });
      h += '</tr></thead><tbody>';
      periods.forEach(function (per) {
        h += '<tr><th class="ph">' + escapeHtml(per.label || (per.period + '限'))
          + (per.time ? '<small>' + escapeHtml(per.time) + '</small>' : '') + '</th>';
        p.days.forEach(function (d) {
          var key = d + per.period;
          h += '<td><label><input type="checkbox" data-type="' + escapeAttr(type) + '"'
            + ' data-slot="' + escapeAttr(key) + '"'
            + (chosen[key] ? ' checked' : '') + '></label></td>';
        });
        h += '</tr>';
      });
      h += '</tbody></table></div>' +
        '<div class="slotops">' +
        '<button class="btn sm" type="button" data-all="' + escapeAttr(type) + '" data-on="1">すべて選ぶ</button>' +
        '<button class="btn sm" type="button" data-all="' + escapeAttr(type) + '" data-on="">すべて外す</button>' +
        '</div>';
      return h;
    }

    // タブ切り替えと「すべて選ぶ／外す」。再描画しないので入力途中の内容は消えない。
    document.addEventListener('click', function (ev) {
      if (!ev.target || !ev.target.closest) return;
      var tab = ev.target.closest('.tab[data-tab]');
      if (tab) {
        var name = tab.getAttribute('data-tab');
        document.querySelectorAll('.tab[data-tab]').forEach(function (b) {
          b.classList.toggle('on', b === tab);
        });
        document.querySelectorAll('.pane[data-pane]').forEach(function (el) {
          el.hidden = el.getAttribute('data-pane') !== name;
        });
        return;
      }
      var all = ev.target.closest('button[data-all]');
      if (all) setAll(all.getAttribute('data-all'), !!all.getAttribute('data-on'));
    });

    function refreshCounts() {
      document.querySelectorAll('.n[data-count]').forEach(function (el) {
        el.textContent = pickedSlots(el.getAttribute('data-count')).length;
      });
    }
    document.addEventListener('change', function (ev) {
      if (ev.target && ev.target.hasAttribute && ev.target.hasAttribute('data-slot')) refreshCounts();
    });

    function updatedText(at) {
      return at
        ? '最終更新: ' + escapeHtml(at)
        : 'まだ一度も更新されていません（職員が入力した内容のままです）。';
    }

    function setAll(type, on) {
      document.querySelectorAll('input[data-type="' + type + '"]').forEach(function (b) {
        b.checked = on;
      });
      refreshCounts();
    }

    function pickedSlots(type) {
      var out = [];
      document.querySelectorAll('input[data-type="' + type + '"]').forEach(function (b) {
        if (b.checked) out.push(b.getAttribute('data-slot'));
      });
      return out;
    }

    // 表示中のタブだけでなく全業務ぶんを送る（見ていないタブの内容を消さないため）
    function pickedSlotsByType(p) {
      var out = {};
      (p.supportTypes || []).forEach(function (t) { out[t] = pickedSlots(t); });
      return out;
    }

    function save() {
      // 学生が対応できる業務を1つも選んでいないときは往復させずにここで止める
      // （サーバー側でも同じ検証をしている。空欄＝全対応に倒れるのを防ぐため・D31）
      if (P && P.isStudent && pickedSkills().length === 0) {
        showToast('対応できる業務を1つ以上選んでください（すべて外すと、逆にすべての依頼が届きます）。', false);
        return;
      }
      var btn = document.getElementById('save');
      btn.disabled = true;
      btn.textContent = '保存中…';
      google.script.run
        .withSuccessHandler(onSaved)
        .withFailureHandler(function (err) {
          btn.disabled = false;
          btn.textContent = 'この内容で保存する';
          showToast(err.message, false);
        })
        .updateMyProfile({
          phone: val('phone'),
          webhook_url: val('webhook'),
          skills: pickedSkills(),
          slotsByType: pickedSlotsByType(P),
        });
    }

    function onSaved(res) {
      var btn = document.getElementById('save');
      btn.disabled = false;
      btn.textContent = 'この内容で保存する';

      var up = document.getElementById('updated');
      if (up && res.slots_updated_at) up.textContent = updatedText(res.slots_updated_at);

      var msg = '保存しました。';
      if (res.warnings && res.warnings.length) {
        // 保存自体は成功しているので、止めずに注意だけ添える
        showToast(msg + ' ただし注意があります：' + res.warnings.join(' / '), null);
        return;
      }
      showToast(msg, true);
    }

    // ok=true: 成功 / ok=false: エラー / ok=null: 成功したが注意あり
    function showToast(text, ok) {
      var t = document.getElementById('toast');
      t.className = 'notice toast ' + (ok === false ? 'err' : (ok === null ? 'warn' : 'ok'));
      t.style.display = 'block';
      t.textContent = text;
      t.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    google.script.run
      .withSuccessHandler(render)
      .withFailureHandler(function (err) {
        var host = document.getElementById('body');
        host.className = 'state';
        host.textContent = 'エラー: ' + err.message;
      })
      .getMyProfile();
  </script>
</body>
</html>
