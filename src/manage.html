<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include('shared-styles') ?>
  <style>
    :root { --main-max: 720px; }

    /* 欠員1件のカード。左の色帯で「対応中／確定」が一目で分かるようにする */
    .vac { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--border-strong); border-radius: var(--radius);
           padding: 16px 18px; margin-bottom: 14px; box-shadow: var(--shadow-1); }
    .vac.open { border-left-color: var(--danger); }
    .vac.done { border-left-color: var(--brand); }
    .vac h2 { font-size: 1rem; margin: 0 0 4px; font-weight: 700; }
    .vac .meta { font-size: .82rem; color: var(--text-muted); margin-bottom: 10px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: var(--radius-pill);
             font-size: .78rem; font-weight: 600; }
    .b-open { background: var(--danger-bg); color: var(--danger); }
    .b-done { background: var(--info-bg); color: var(--info); }
    .resp { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; }
    .resp-row { display: flex; align-items: center; justify-content: space-between;
                gap: 10px; padding: 7px 0; font-size: .9rem; }
    .ans { font-size: .78rem; padding: 1px 8px; border-radius: var(--radius-pill); margin-left: 6px; }
    .ans-ok { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
    .ans-no { background: #f1f3f6; color: var(--text-muted); }
    .ans-wait { background: var(--warn-bg); color: var(--warn); }
    .resp-h { font-size: .82rem; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
    .cand-right { display: flex; align-items: center; gap: 10px; }
    .tel { font-size: .9rem; color: var(--brand-ink); text-decoration: none; white-space: nowrap; }
    .tel:hover { text-decoration: underline; }
    .nophone { font-size: .8rem; color: var(--warn); }
    .alt { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    .none { font-size: .85rem; color: var(--text-faint); padding: 6px 0; }
    .done-line { font-size: .9rem; color: var(--brand-ink); font-weight: 700; }
  </style>
</head>
<body>
  <?!= chrome ?>

  <main>
    <div id="content" class="state">読み込み中…</div>
  </main>

  <script>
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function render(list) {
      var content = document.getElementById('content');
      if (!list || list.length === 0) {
        content.className = 'state';
        content.textContent = '欠員はありません。';
        return;
      }
      // 未解決を上に並べる
      list.sort(function (a, b) { return (a.result ? 1 : 0) - (b.result ? 1 : 0); });

      content.className = '';
      content.innerHTML = list.map(renderVacancy).join('');
    }

    function renderVacancy(v) {
      var resolved = !!v.result;
      var head =
        '<h2>' + escapeHtml(v.day + v.period) + '限'
          + (v.time ? '（' + escapeHtml(v.time) + '）' : '') + '</h2>' +
        '<div class="meta">' + escapeHtml(v.date) + '　欠勤: ' + escapeHtml(v.absentName) +
          '　／　欠員ID: ' + escapeHtml(v.vacancy_id) + '</div>';

      if (resolved) {
        var label = v.result === '補充済' && v.substituteName
          ? '補充済（代行: ' + escapeHtml(v.substituteName) + '）'
          : escapeHtml(v.result);
        return '<div class="vac done"><span class="badge b-done">確定</span> ' +
          '<span class="done-line">' + label + '</span>' +
          '<div style="margin-top:6px">' + head + '</div>' +
          '<div class="alt"><button class="btn sm" onclick="reopen(\'' + v.vacancy_id +
            '\',this)">再オープン（変更する）</button></div>' +
          '</div>';
      }

      // 未解決：代行候補（空きコマ学生）を電話番号・回答状況つきで一覧。
      // 返信が来ないときは職員がこの番号に電話し、口頭でOKなら「確定」する。
      var respHtml;
      if (!v.candidates || v.candidates.length === 0) {
        respHtml = '<div class="none">空きのある代行候補がいません。下のボタンで決着してください。</div>';
      } else {
        respHtml = '<div class="resp-h">代行候補（空きコマ・電話）</div>' +
          v.candidates.map(function (c) {
            var st = c.answer === '承諾' ? '承諾' : (c.answer === '辞退' ? '辞退' : '未回答');
            var stCls = c.answer === '承諾' ? 'ans-ok' : (c.answer === '辞退' ? 'ans-no' : 'ans-wait');
            var phone = c.phone
              ? '<a class="tel" href="tel:' + escapeHtml(c.phone) + '">📞 ' + escapeHtml(c.phone) + '</a>'
              : '<span class="nophone">電話未登録</span>';
            return '<div class="resp-row">' +
              '<div>' + escapeHtml(c.name) + '<span class="ans ' + stCls + '">' + st + '</span></div>' +
              '<div class="cand-right">' + phone +
                '<button class="btn sm ok" onclick="confirmSub(\'' + v.vacancy_id + '\',\'' +
                  c.staff_id + '\',this)">確定</button>' +
              '</div></div>';
          }).join('');
      }

      var alt =
        '<div class="alt">' +
        '<button class="btn sm" onclick="setResult(\'' + v.vacancy_id + '\',\'1人テイク\',this)">1人テイクにする</button>' +
        '<button class="btn sm" onclick="setResult(\'' + v.vacancy_id + '\',\'職員対応\',this)">職員対応にする</button>' +
        '</div>';

      return '<div class="vac open"><span class="badge b-open">対応中</span>' + head +
        '<div class="resp">' + respHtml + '</div>' + alt + '</div>';
    }

    function reload() {
      google.script.run.withSuccessHandler(render).withFailureHandler(onError).getVacanciesForManage();
    }

    function confirmSub(vacancyId, staffId, btn) {
      if (!confirm('この候補者を代行者として確定します。よろしいですか？')) return;
      disableAll(btn);
      google.script.run
        .withSuccessHandler(reload)
        .withFailureHandler(function (err) { alert('エラー: ' + err.message); reload(); })
        .confirmSubstitute(vacancyId, staffId);
    }

    function setResult(vacancyId, result, btn) {
      if (!confirm('この欠員を「' + result + '」として決着させます。よろしいですか？')) return;
      disableAll(btn);
      google.script.run
        .withSuccessHandler(reload)
        .withFailureHandler(function (err) { alert('エラー: ' + err.message); reload(); })
        .setVacancyResult(vacancyId, result);
    }

    function reopen(vacancyId, btn) {
      if (!confirm('この欠員を未確定に戻し、候補者へ代行を再募集します。代行者の充て直しや結果の変更ができます。よろしいですか？')) return;
      disableAll(btn);
      google.script.run
        .withSuccessHandler(reload)
        .withFailureHandler(function (err) { alert('エラー: ' + err.message); reload(); })
        .reopenVacancy(vacancyId);
    }

    function disableAll(btn) {
      var buttons = document.querySelectorAll('button');
      buttons.forEach(function (b) { b.disabled = true; });
      if (btn) btn.textContent = '処理中…';
    }

    function onError(err) {
      var content = document.getElementById('content');
      content.className = 'state';
      content.textContent = 'エラー: ' + err.message;
    }

    reload();
  </script>
</body>
</html>
