<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include('shared-styles') ?>
  <style>
    :root { --main-max: 1100px; --help: #c47f00; }   /* --help = 介助（オレンジ） */
    main { padding: 14px; }

    /* 絞り込みバー。項目が多いので白いカードにまとめて本文と切り分ける */
    .filters { background: var(--surface); border: 1px solid var(--border);
               border-radius: var(--radius); box-shadow: var(--shadow-1);
               padding: 11px 14px; margin-bottom: 12px; }
    .filterbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .toolbar label { font-size: .82rem; color: var(--text-muted); font-weight: 600; }
    .toolbar select { padding: 7px 10px; font-size: .88rem; }
    .legend { font-size: .76rem; color: var(--text-faint); margin-left: auto; }

    /* 「絞り込み」開閉ボタン。PCでは絞り込みを常に出すので隠す */
    .ftoggle { display: none; gap: 5px; }
    .ftoggle .caret { font-size: .7rem; transition: transform .15s ease; }
    .filters.open .ftoggle .caret { transform: rotate(180deg); }
    /* 折りたたんでいても「何件絞り込み中か」が分かるようにバッジを出す */
    .fbadge { display: inline-flex; align-items: center; justify-content: center;
              min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--radius-pill);
              background: var(--brand); color: #fff; font-size: .72rem; font-weight: 700; }
    .fbadge[hidden] { display: none; }
    .mv-short { display: none; }
    .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px;
                margin-right: 3px; vertical-align: 0; }
    .count { font-size: .8rem; color: var(--text-muted); margin-bottom: 8px; }

    /* コマのカード（ボタン式・PC/スマホ共通）。左の色帯で種別と状態を出す */
    .cd { display: block; width: 100%; text-align: left; cursor: pointer;
          border: 1px solid var(--border); border-left: 4px solid var(--border-strong);
          border-radius: var(--radius-sm);
          padding: 8px 10px; margin: 5px 0; font-size: .95rem; line-height: 1.5;
          background: var(--surface-alt); color: var(--text);
          transition: background .12s ease, box-shadow .12s ease; }
    .cd:hover { background: var(--brand-soft); }
    .cd:active { background: #e3edfc; }
    .cd.take { border-left-color: var(--brand); }
    .cd.help { border-left-color: var(--help); }
    .cd.open { border-left-color: var(--ok); background: #f2faf5; }
    .cd.open:hover { background: #e7f6ed; }
    .cd.mine { border-left-color: var(--brand); background: var(--brand-soft); }
    .cd.mine-open { border-left-color: var(--ok); background: #e4f7eb;
                    box-shadow: 0 0 0 2px #b6e6c4 inset; }
    .cd.mine-open:hover { background: #d7f2e1; }
    .myview { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem;
              color: var(--brand-ink); font-weight: 600;
              border: 1px solid var(--brand-border); border-radius: var(--radius-pill);
              padding: 6px 13px; cursor: pointer; }
    .myview:hover { background: var(--brand-soft); }
    .myview input { margin: 0; }
    .cd-staff { display: block; color: var(--ok); margin-top: 3px; }
    .cd-room { display: block; color: var(--text-muted); margin-top: 1px; font-size: .88rem; }
    .cd-more { float: right; color: var(--text-faint); font-size: .82rem; }
    .tag { display: inline-block; font-size: .78rem; font-weight: 600; padding: 1px 9px;
           border-radius: var(--radius-pill); color: #fff; margin-right: 4px; vertical-align: 1px; }
    .tag.take { background: var(--brand); }
    .tag.help { background: var(--help); }
    .st { display: inline-block; font-size: .8rem; padding: 1px 9px;
          border-radius: var(--radius-pill); margin-top: 5px; }
    .st-open   { background: #d9f1e2; color: var(--ok); font-weight: 700; }
    .st-myopen { background: var(--ok); color: #fff; font-weight: 700; }
    .st-mine   { background: var(--brand-soft); color: var(--brand-ink); font-weight: 700; }
    .st-vacant { background: var(--danger-bg); color: var(--danger); font-weight: 700; }
    .st-filled { background: var(--brand-soft); color: var(--brand-ink); }
    .st-other  { background: #f1f3f6; color: var(--text-muted); }
    .sub-name { color: var(--brand-ink); font-weight: 700; }

    /* ===== 週ナビ（欠員は日付に紐づくので、表示する週を必ず1つに決める・D23）===== */
    .weekbar { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; flex-wrap: wrap; }
    .weekbar .wk-range { font-weight: 700; font-size: 1rem; min-width: 12.5em; text-align: center; }
    .weekbar .wk-now { background: var(--brand-soft); color: var(--brand-ink);
                       border-color: var(--brand-border); font-weight: 700; }
    .weekbar .wk-tag { font-size: .78rem; color: var(--text-muted); }
    /* 曜日見出しの日付（PC表・スマホタブ共通の見た目） */
    .pc thead th small { display: block; font-weight: normal; font-size: .74rem; opacity: .85; margin-top: 2px; }
    .tabs button small { display: block; font-size: .72rem; opacity: .8; }
    .tabs button.today, .pc thead th.today { outline: 2px solid var(--ok); outline-offset: -2px; }
    /* 学期境界の但し書き（terms は曜日ごとのズレを表現できないため・D23） */
    .termnote { font-size: .8rem; color: var(--text-muted); line-height: 1.6; margin: 0 0 10px; }

    /* ===== 詳細モーダル ===== */
    .modal { display: none; position: fixed; inset: 0; z-index: 50; padding: 16px;
             background: rgba(16,24,40,.45); align-items: center; justify-content: center; }
    .modal.show { display: flex; }
    .sheet { position: relative; background: var(--surface); border-radius: 14px; width: 100%;
             max-width: 420px; max-height: 90vh; overflow: auto; padding: 18px 18px 22px;
             box-shadow: 0 12px 40px rgba(16,24,40,.28); }
    .sheet .x { position: absolute; top: 6px; right: 10px; border: none; background: none;
                font-size: 1.5rem; line-height: 1; color: var(--text-faint); cursor: pointer; }
    .m-title { margin: 0 0 16px; font-size: 1.2rem; }
    .m-dl { display: grid; grid-template-columns: 92px 1fr; gap: 10px 12px; margin: 0; font-size: 1.02rem; }
    .m-dl dt { color: var(--text-muted); font-size: .92rem; }
    .m-dl dd { margin: 0; }
    .m-status { margin-top: 16px; font-size: .98rem; color: var(--text-muted); }
    /* モーダル下部の操作（欠勤連絡への導線・D24）。情報表示と視覚的に区切る */
    .m-act { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
    .m-act .hint { text-align: center; }
    @media (max-width: 760px) {
      .modal { align-items: flex-end; padding: 0; }
      .sheet { max-width: none; border-radius: 14px 14px 0 0; max-height: 85vh; }
    }

    /* ===== PC：時間割グリッド ===== */
    .pc table { width: 100%; border-collapse: separate; border-spacing: 0;
                background: var(--surface); border-radius: var(--radius);
                overflow: hidden; box-shadow: var(--shadow-1); table-layout: fixed; }
    .pc th, .pc td { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
                     vertical-align: top; }
    .pc tr > *:last-child { border-right: none; }
    .pc thead th { background: var(--brand); color: #fff; padding: 10px; font-size: .95rem;
                   border-color: var(--brand-dark); font-weight: 600; }
    .pc .ph { background: var(--surface-alt); width: 88px; text-align: center; font-size: .9rem;
              padding: 8px; color: var(--text); font-weight: 600; }
    .pc .ph small { display: block; color: var(--text-faint); font-weight: normal;
                    font-size: .72rem; margin-top: 2px; }
    .pc td.cell, .pc td.empty { padding: 5px; height: 56px; }
    .pc td.empty { background: #fbfcfd; }

    /* ===== スマホ：曜日タブ＋その日のカード ===== */
    .mb { display: none; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; }
    .tabs button { flex: 0 0 auto; border: 1px solid var(--brand-border); background: var(--surface);
                   color: var(--brand-ink); border-radius: var(--radius-pill);
                   padding: 7px 16px; font-size: .95rem; cursor: pointer; }
    .tabs button.on { background: var(--brand); color: #fff; border-color: var(--brand); font-weight: 600; }
    .per { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
           margin-bottom: 10px; box-shadow: var(--shadow-1); overflow: hidden; }
    .per-h { background: var(--surface-alt); padding: 8px 12px; font-size: .95rem; font-weight: 700;
             color: var(--text); border-bottom: 1px solid var(--border); }
    .per-h small { color: var(--text-faint); font-weight: normal; margin-left: 6px; }
    .per-b { padding: 6px 8px; }
    .per-empty { color: var(--text-faint); font-size: .85rem; padding: 6px 2px; }

    @media (max-width: 760px) {
      .pc { display: none; }
      .mb { display: block; }
      .legend { display: none; }

      /* スマホは時間割を優先し、絞り込みは既定で閉じておく（.open で開く）。
         マイビューは折りたたみの外なので、閉じていても1タップで切り替えられる。 */
      .ftoggle { display: inline-flex; }
      .toolbar { display: none; }
      .filters.open .toolbar { display: flex; }
      .mv-long { display: none; }
      .mv-short { display: inline; }
      /* 開いたときは1項目1行にして、ラベルと選択肢が横に潰れないようにする */
      .filters.open .toolbar { flex-direction: column; align-items: stretch; gap: 8px; }
      .toolbar label { margin-bottom: -4px; }
      .toolbar select { width: 100%; font-size: .95rem; padding: 9px 11px; }
      .toolbar .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <?!= chrome ?>

  <main>
    <div class="filters">
      <!-- 常に見えている行。スマホでは「絞り込み」ボタンで下の toolbar を開閉する。
           マイビューは1タップで切り替えたいので、折りたたみの外に置く。 -->
      <div class="filterbar">
        <button type="button" class="btn sm ftoggle" id="fToggle" onclick="toggleFilters()"
                aria-expanded="false" aria-controls="toolbar">
          絞り込み<span class="fbadge" id="fBadge" hidden></span><span class="caret">▾</span>
        </button>
        <label class="myview" id="myviewLabel" style="display:none">
          <input type="checkbox" id="fMine" onchange="applyFilters()">
          <span class="mv-long">マイビュー（自分の担当＋入れる募集中）</span>
          <span class="mv-short">マイビュー</span>
        </label>
        <span class="legend">
          <i style="background:var(--brand)"></i>テイク（2名）
          　<i style="background:var(--help)"></i>介助（1名）
          　<i style="background:var(--ok)"></i>募集中
        </span>
      </div>

      <div class="toolbar" id="toolbar">
        <label for="q">クォーター</label>
        <select id="q" onchange="onQuarter()"></select>
        <label for="fUser">利用者</label>
        <select id="fUser" onchange="applyFilters()"></select>
        <label for="fStaff">スタッフ</label>
        <select id="fStaff" onchange="applyFilters()"></select>
        <label for="fType">内容</label>
        <select id="fType" onchange="applyFilters()">
          <option value="__all__">すべて</option>
          <option value="テイク">テイク</option>
          <option value="介助">介助</option>
        </select>
        <button class="btn sm" onclick="resetFilters()" type="button">クリア</button>
      </div>
    </div>
    <div class="weekbar">
      <button type="button" class="btn sm" onclick="shiftWeek(-1)" aria-label="前の週">◀ 前の週</button>
      <span class="wk-range" id="wkRange">—</span>
      <button type="button" class="btn sm" onclick="shiftWeek(1)" aria-label="次の週">次の週 ▶</button>
      <button type="button" class="btn sm wk-now" id="wkNow" onclick="goThisWeek()">今週へ</button>
      <span class="wk-tag" id="wkTag"></span>
    </div>
    <p class="termnote">※ <?= TERM_BOUNDARY_NOTICE ?></p>
    <div id="count" class="count"></div>
    <div id="content" class="state">読み込み中…</div>
  </main>

  <div id="modal" class="modal" onclick="closeDetail(event)">
    <div class="sheet" onclick="event.stopPropagation()">
      <button class="x" type="button" onclick="closeDetail()" aria-label="閉じる">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    var DATA = null;          // サーバーから来た全データ
    var VIEW = null;          // 絞り込み後の { courses, days, periods }
    var WEEK = null;          // 表示中の週 { start, end, isThisWeek, dateByDay, labelByDay }
    var WEEK_COURSE_COUNT = 0; // 表示中の週に「授業がある」コマ数（開講期間で絞った後）
    var curDay = null;
    var MYVIEW = false;       // マイビュー（自分の担当＋入れる募集中）モードか
    var ME = '<?= user.name ?>';  // ログイン中スタッフの氏名（自分絞り込み用）
    var APP_URL = '<?= appUrl ?>';  // 画面間リンクの組み立て用（欠勤連絡への受け渡し・D24）

    // 自分が担当しているコマか
    function isMine(c) { return c.staffA === ME || c.staffB === ME; }

    // 自分が「入れる」募集中の空き枠か（テイク1名・スキル一致・その時限が自分の空き）
    function isMyOpen(c) {
      if (!(c.support_type === 'テイク' && !c.staffB && (!c.status || c.status === '通常'))) return false;
      if (isMine(c)) return false;
      var me = (DATA && DATA.me) || { skills: [], slots: [] };
      if (me.skills.length && me.skills.indexOf(c.support_type) === -1) return false; // スキル不適合
      return me.slots.indexOf(c.day + c.period) !== -1;                                // その時限が空き
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // コマ1件のカードHTML（ボタン式。顔は最小限、詳細はタップで表示）
    function card(c) {
      var isTake = c.support_type === 'テイク';
      var cls = isTake ? 'take' : 'help';
      var isOpen = isTake && !c.staffB && (!c.status || c.status === '通常');
      // マイビュー時は「自分の担当」「自分が入れる募集中」を強調表示
      var myOpen = MYVIEW && isMyOpen(c);
      var mine = MYVIEW && isMine(c);
      if (myOpen) cls += ' mine-open';
      else if (mine) cls += ' mine';
      else if (isOpen) cls += ' open';
      var staff = escapeHtml(c.staffA || '—') + (c.staffB ? ' ・ ' + escapeHtml(c.staffB) : '');
      var html = '<button type="button" class="cd ' + cls + '" onclick="openDetail(\'' +
        escapeAttr(c.course_id) + '\')">' +
        '<span class="cd-more">詳細 ›</span>' +
        '<span class="tag ' + cls + '">' + escapeHtml(c.support_type || 'コマ') + '</span>' +
        '<span class="cd-staff">' + staff + '</span>';
      if (c.room) html += '<span class="cd-room">教室: ' + escapeHtml(c.room) + '</span>';
      if (myOpen) html += '<span class="st st-myopen">✅ あなたが入れます</span>';
      else if (mine) html += '<span class="st st-mine">自分の担当</span>';
      else html += statusBadge(c);
      html += '</button>';
      return html;
    }

    function statusBadge(c) {
      // テイクなのに担当が1名 ＝ 恒常的に枠が空いている（誰でも入れる）
      if ((!c.status || c.status === '通常') && c.support_type === 'テイク' && !c.staffB) {
        return '<span class="st st-open">あと1名 募集中</span>';
      }
      if (!c.status || c.status === '通常') return '';
      var cls = c.status === '欠員対応中' ? 'st-vacant'
              : c.status === '補充済' ? 'st-filled' : 'st-other';
      // 欠勤者が分かるなら「誰の代わりか」を必ず添える。
      // 週表示になったので、この状態は「表示中の週のその日」の話に限定される（D23）。
      var who = (c.absent && c.absent.length) ? c.absent.join('・') : '';
      var txt = escapeHtml(c.status);
      if (c.status === '補充済' && c.substitute) {
        txt = (who ? escapeHtml(who) + ' → ' : '補充済 → ') +
              '<span class="sub-name">' + escapeHtml(c.substitute) + '</span>';
      } else if (who) {
        txt = escapeHtml(c.status) + '（' + escapeHtml(who) + '）';
      }
      return '<span class="st ' + cls + '">' + txt + '</span>';
    }

    function escapeAttr(s) {
      return escapeHtml(s).replace(/'/g, '&#39;').replace(/"/g, '&quot;');
    }

    // ===== 詳細モーダル =====
    function courseById(id) {
      if (!DATA) return null;
      for (var i = 0; i < DATA.courses.length; i++) {
        if (DATA.courses[i].course_id === id) return DATA.courses[i];
      }
      return null;
    }

    function periodTime(period) {
      if (!DATA || !DATA.periods) return '';
      for (var i = 0; i < DATA.periods.length; i++) {
        if (DATA.periods[i].period === period) return DATA.periods[i].time || '';
      }
      return '';
    }

    // 学期の表示ラベル（例：2026-2Q（クォーター）／2026-前期（セメスター））
    function termLabel(c) {
      var t = c.term || '';
      if (!t) return '—';
      var s = { quarter: 'クォーター', semester: 'セメスター' }[c.system] || '';
      return escapeHtml(t) + (s ? '（' + s + '）' : '');
    }

    // 詳細モーダルの下部に「この日の欠勤を連絡」への導線を出す（D24）。
    //
    // ここでは登録せず、コマと日付を選んだ状態で欠勤連絡（absence）画面を開くだけにする。
    // 欠勤登録は候補者全員へ Chat 通知が飛ぶ取り消しにくい操作なので、時間割のセルから
    // 2タップで確定できる形にはしない。送信ボタンは absence 画面の1つに保つ
    // （締切超過の案内・候補0人の自動決着・通知結果の要約もあちらに集約されている）。
    function absenceAction(c) {
      if (!isMine(c)) return '';            // 自分の担当コマ以外には出さない
      if (!c.date || !c.inTerm) return '';  // その週に授業が無い（学期の期間外）

      var note = function (cls, text) {
        return '<div class="m-act"><div class="notice ' + cls + '">' +
               escapeHtml(text) + '</div></div>';
      };
      // 既に自分の欠勤が登録済みの日（二重登録はサーバーも弾く）
      if (c.absent && c.absent.indexOf(ME) !== -1) {
        return note('info', 'この日はあなたの欠勤を登録済みです。');
      }
      // 過去日には登録できない（サーバーの検証と同じ条件を先に画面で示す）
      if (DATA && c.date < DATA.today) {
        return note('warn', '過ぎた日には欠勤を登録できません。');
      }

      var url = APP_URL + '?page=absence&course=' + encodeURIComponent(c.course_id) +
                '&date=' + encodeURIComponent(c.date);
      var label = ((WEEK && WEEK.labelByDay[c.day]) || c.date) + '（' + c.day + '）';
      return '<div class="m-act">' +
        '<a class="btn danger block" href="' + escapeAttr(url) + '">' +
          escapeHtml(label) + ' の欠勤を連絡する</a>' +
        '<p class="hint">欠勤連絡の画面が、このコマと日付を選んだ状態で開きます。</p>' +
      '</div>';
    }

    function openDetail(courseId) {
      var c = courseById(courseId);
      if (!c) return;
      var pt = periodTime(c.period);
      var rows = [
        ['内容', escapeHtml(c.support_type || '—')],
        ['学期', termLabel(c)],
        ['日時', escapeHtml(c.day) + '曜 ' + escapeHtml(c.period) + '限' +
          (pt ? '（' + escapeHtml(pt) + '）' : '')],
        // 表示中の週における実施日。欠員の状態はこの日付に対するもの（D23）
        ['この週の日付', escapeHtml(c.date || '—')],
        ['利用者', escapeHtml(c.user_student || '—')],
        ['科目', escapeHtml(c.subject || '—')],
        ['担当教員', escapeHtml(c.instructor || '—')],
        ['教室', escapeHtml(c.room || '—')],
        ['担当スタッフ', escapeHtml(c.staffA || '—') + (c.staffB ? ' ・ ' + escapeHtml(c.staffB) : '')],
      ];
      // その日に欠勤・代行があれば、元の担当とは別に明示する
      if (c.absent && c.absent.length) rows.push(['この日の欠勤', escapeHtml(c.absent.join('・'))]);
      if (c.substitute) rows.push(['この日の代行', escapeHtml(c.substitute)]);
      if (c.note) rows.push(['備考', escapeHtml(c.note)]);

      var tagCls = c.support_type === 'テイク' ? 'take' : 'help';
      var body = '<h3 class="m-title"><span class="tag ' + tagCls + '">' +
        escapeHtml(c.support_type || 'コマ') + '</span>' + escapeHtml(c.user_student || '') + '</h3>';
      body += '<dl class="m-dl">' + rows.map(function (r) {
        return '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>';
      }).join('') + '</dl>';
      var sb = statusBadge(c);
      if (sb) body += '<div class="m-status">状態 ' + sb + '</div>';
      body += absenceAction(c);

      document.getElementById('modalBody').innerHTML = body;
      document.getElementById('modal').classList.add('show');
    }

    function closeDetail(e) {
      if (e && e.type === 'click' && e.target.id !== 'modal') return;
      document.getElementById('modal').classList.remove('show');
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeDetail();
    });

    // 指定 day+period のコマ配列（絞り込み後の VIEW から）
    function cellCourses(day, period) {
      return VIEW.courses.filter(function (c) { return c.day === day && c.period === period; });
    }

    // その曜日が「表示中の週で何月何日か」／今日かどうか
    function dayLabel(day) {
      return (WEEK && WEEK.labelByDay[day]) || '';
    }
    // 「今日」はサーバーのJST（DATA.today）で判定する。端末の時計やタイムゾーンに依存させない
    function isToday(day) {
      return !!(WEEK && DATA && WEEK.dateByDay[day] === DATA.today);
    }

    // ===== PC：グリッド =====
    function renderPC() {
      var d = VIEW;
      var h = '<div class="pc"><table><thead><tr><th class="ph">時限</th>';
      d.days.forEach(function (day) {
        h += '<th' + (isToday(day) ? ' class="today"' : '') + '>' + escapeHtml(day) +
             '<small>' + escapeHtml(dayLabel(day)) + '</small></th>';
      });
      h += '</tr></thead><tbody>';
      d.periods.forEach(function (p) {
        h += '<tr><th class="ph">' + escapeHtml(p.period) + '限' +
             (p.time ? '<small>' + escapeHtml(p.time) + '</small>' : '') + '</th>';
        d.days.forEach(function (day) {
          var list = cellCourses(day, p.period);
          if (list.length === 0) { h += '<td class="cell empty"></td>'; return; }
          h += '<td class="cell">' + list.map(card).join('') + '</td>';
        });
        h += '</tr>';
      });
      h += '</tbody></table></div>';
      return h;
    }

    // ===== スマホ：曜日タブ＋カード =====
    function renderMobile() {
      var h = '<div class="mb"><div class="tabs" id="tabs">';
      VIEW.days.forEach(function (day) {
        // data-day で曜日を持つ（ラベルに日付を足したので textContent 比較では判定できない）
        var cls = (day === curDay ? 'on' : '') + (isToday(day) ? ' today' : '');
        h += '<button class="' + cls + '" data-day="' + escapeAttr(day) + '" onclick="selDay(\'' +
             day + '\')">' + escapeHtml(day) +
             '<small>' + escapeHtml(dayLabel(day)) + '</small></button>';
      });
      h += '</div><div id="dayView"></div></div>';
      return h;
    }

    function renderDayView() {
      var host = document.getElementById('dayView');
      if (!host) return;
      // 全時限を枠として並べる（コマが無い時限も空欄で残す）
      host.innerHTML = VIEW.periods.map(function (p) {
        var list = cellCourses(curDay, p.period);
        var body = list.length
          ? list.map(card).join('')
          : '<div class="per-empty">コマなし</div>';
        return '<div class="per"><div class="per-h">' + escapeHtml(p.period) + '限' +
          (p.time ? '<small>' + escapeHtml(p.time) + '</small>' : '') +
          '</div><div class="per-b">' + body + '</div></div>';
      }).join('');
    }

    function selDay(day) {
      curDay = day;
      var tabs = document.querySelectorAll('#tabs button');
      // ラベルには日付も入るので、textContent ではなく data-day で判定する
      tabs.forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-day') === day); });
      renderDayView();
    }

    // 時間割の枠は固定（サーバーが返した曜日・時限を常に全部使う）。
    // コマが無いセルも空欄の枠として残す。
    function buildView(courses) {
      return { courses: courses, days: DATA.days, periods: DATA.periods };
    }

    // 絞り込みを適用して再描画
    function applyFilters() {
      MYVIEW = document.getElementById('fMine').checked;
      // 表示中の週で「授業がある」コマだけを土台にする。
      // 学期の期間外（終了後・開始前）の週では、その学期のコマは空欄になる。
      var base = DATA.courses.filter(function (c) { return c.inTerm; });
      WEEK_COURSE_COUNT = base.length;
      var courses;
      if (MYVIEW) {
        // 自分の担当コマ ＋ 自分が入れる募集中だけに絞る
        courses = base.filter(function (c) { return isMine(c) || isMyOpen(c); });
        setFiltersDisabled(true);
      } else {
        setFiltersDisabled(false);
        var u = val('fUser'), s = val('fStaff'), t = val('fType');
        courses = base.filter(function (c) {
          if (u !== '__all__' && c.user_student !== u) return false;
          if (t !== '__all__' && c.support_type !== t) return false;
          if (s === '__me__') { if (c.staffA !== ME && c.staffB !== ME) return false; }
          else if (s !== '__all__') { if (c.staffA !== s && c.staffB !== s) return false; }
          return true;
        });
      }
      updateFilterBadge();
      VIEW = buildView(courses);
      render();
    }

    // マイビュー中は利用者/スタッフ/内容の絞り込みを無効化（意味が重複するため）
    function setFiltersDisabled(disabled) {
      ['fUser', 'fStaff', 'fType'].forEach(function (id) {
        document.getElementById(id).disabled = disabled;
      });
    }

    // ===== 絞り込みの開閉（スマホ） =====
    // スマホは画面が狭く、絞り込みが常時開いていると時間割が下へ押し下げられるため
    // 既定は閉じておく。PCではCSSで常に開いた状態にしている。
    function toggleFilters() {
      var open = document.querySelector('.filters').classList.toggle('open');
      document.getElementById('fToggle').setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    // 閉じていても絞り込み中だと分かるように、効いている条件の数をバッジに出す
    function updateFilterBadge() {
      var n = 0;
      // マイビュー中は利用者/スタッフ/内容の絞り込みが効かないので数えない
      if (!MYVIEW) {
        if (val('fUser') !== '__all__') n++;
        if (val('fStaff') !== '__all__') n++;
        if (val('fType') !== '__all__') n++;
      }
      // クォーターは既定が「現在（開講中）」＝空文字。別の学期を選んでいれば1件と数える
      if (document.getElementById('q').value) n++;
      var badge = document.getElementById('fBadge');
      badge.textContent = n;
      badge.hidden = (n === 0);
    }

    function resetFilters() {
      ['fUser', 'fStaff', 'fType'].forEach(function (id) { document.getElementById(id).value = '__all__'; });
      document.getElementById('fMine').checked = false;
      applyFilters();
    }

    function val(id) { return document.getElementById(id).value; }

    function render() {
      var content = document.getElementById('content');
      var countEl = document.getElementById('count');
      if (!DATA || DATA.courses.length === 0) {
        countEl.textContent = '';
        content.className = 'state';
        content.textContent = '表示できるコマがありません。（このクォーターの時間割が未登録の可能性があります）';
        return;
      }
      if (MYVIEW) {
        var mineN = VIEW.courses.filter(isMine).length;
        var openN = VIEW.courses.filter(isMyOpen).length;
        countEl.textContent = 'あなたの担当 ' + mineN + ' コマ ／ 入れる募集中 ' + openN + ' 枠';
      } else {
        // 分母は「この週に授業があるコマ数」。学期の期間外の週では 0 になる
        countEl.textContent = '表示中: ' + VIEW.courses.length + ' / ' + WEEK_COURSE_COUNT + ' コマ';
      }
      if (VIEW.courses.length === 0) {
        content.className = 'state';
        // この週に授業があるコマが1つも無い＝開講期間の外（学期の前後・長期休暇中）。
        // 絞り込みのせいで空になったのと区別できないと「壊れている」ように見えるため文言を分ける。
        content.textContent = WEEK_COURSE_COUNT === 0
          ? 'この週は授業期間外です（' + WEEK.labelByDay['月'] + '〜' + WEEK.labelByDay['日'] +
            '）。「今週へ」または前後の週をご確認ください。'
          : (MYVIEW
              ? '担当コマも、いま入れる募集中もありません。'
              : '条件に合うコマがありません。「クリア」で絞り込みを解除できます。');
        return;
      }
      // スマホ初期表示曜日：今週を見ているなら今日、別の週なら週頭（月）。
      // 週を送っても選択中の曜日は保つ（同じ曜日で前後の週を見比べられるように）。
      var todayDay = null;
      if (WEEK) {
        ['月', '火', '水', '木', '金', '土', '日'].forEach(function (d) {
          if (isToday(d)) todayDay = d;
        });
      }
      var wantDay = curDay || (WEEK && WEEK.isThisWeek && todayDay) || '月';
      curDay = VIEW.days.indexOf(wantDay) !== -1 ? wantDay : VIEW.days[0];

      content.className = '';
      content.innerHTML = renderPC() + renderMobile();
      renderDayView();
    }

    function fillQuarters() {
      var sel = document.getElementById('q');
      // DATA.quarters は {value,label} の配列（value='' は「現在（開講中）」の和集合）
      sel.innerHTML = DATA.quarters.map(function (o) {
        return '<option value="' + escapeHtml(o.value) + '"' +
          (o.value === DATA.quarter ? ' selected' : '') + '>' + escapeHtml(o.label) + '</option>';
      }).join('');
      sel.style.display = DATA.quarters.length > 1 ? '' : 'none';
    }

    // 利用者・スタッフの絞り込み候補を投入（選択値は可能なら維持）
    function fillFilters() {
      var users = uniqueSorted(DATA.courses.map(function (c) { return c.user_student; }));
      var staffNames = uniqueSorted([].concat(
        DATA.courses.map(function (c) { return c.staffA; }),
        DATA.courses.map(function (c) { return c.staffB; })
      ).filter(Boolean));

      setOptions('fUser',
        [{ v: '__all__', t: '全利用者' }].concat(users.map(function (u) { return { v: u, t: u }; })));

      var staffOpts = [{ v: '__all__', t: '全スタッフ' }];
      if (ME && staffNames.indexOf(ME) !== -1) staffOpts.push({ v: '__me__', t: '自分（' + ME + '）' });
      staffOpts = staffOpts.concat(staffNames.map(function (n) { return { v: n, t: n }; }));
      setOptions('fStaff', staffOpts);

      // マイビューは「シフトに入る学生スタッフ」向け。職員には出さない。
      var showMine = DATA.me && DATA.me.role === '学生';
      document.getElementById('myviewLabel').style.display = showMine ? '' : 'none';
    }

    function setOptions(id, opts) {
      var sel = document.getElementById(id);
      var keep = sel.value;
      sel.innerHTML = opts.map(function (o) {
        return '<option value="' + escapeHtml(o.v) + '">' + escapeHtml(o.t) + '</option>';
      }).join('');
      // 再描画前の選択値が残っていれば維持
      var has = opts.some(function (o) { return o.v === keep; });
      sel.value = has ? keep : '__all__';
    }

    function uniqueSorted(arr) {
      var seen = {}, out = [];
      arr.forEach(function (x) { if (x && !seen[x]) { seen[x] = true; out.push(x); } });
      return out.sort();
    }

    function onQuarter() {
      // 学期を変えても、見ている週は保つ（週はクライアント側の状態なので再取得不要）
      load(document.getElementById('q').value);
    }

    // ===== 週の移動（D23）=====
    //
    // 欠員は日付に紐づくので表示する週を1つに決める必要があるが、週で変わるのは
    // 「欠員の重ね合わせ」だけで、コマ・スタッフ・時限・学期は変わらない。
    // サーバーは DATA.vacancy（course_id|日付 の索引）を全部くれているので、
    // 週送りはここだけで完結する（サーバーへの往復ゼロ＝待ち時間なし）。

    var ISO = function (d) {
      return d.getFullYear() + '-' +
        ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    };
    var parseISO = function (s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); };

    // 日付を含む週の月曜（getDay: 日=0 なので日曜は6日戻す）
    function mondayOf(d) {
      var m = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      m.setDate(m.getDate() - ((m.getDay() + 6) % 7));
      return m;
    }

    // 週の情報を組み立てる。基準日（today）はサーバーのJSTを使う（端末の時計に依存しない）
    function buildWeek(startISO) {
      var monday = mondayOf(startISO ? parseISO(startISO) : parseISO(DATA.today));
      var dateByDay = {}, labelByDay = {};
      ['月', '火', '水', '木', '金', '土', '日'].forEach(function (name, i) {
        var d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
        dateByDay[name] = ISO(d);
        labelByDay[name] = (d.getMonth() + 1) + '/' + d.getDate();
      });
      return {
        start: dateByDay['月'],
        end: dateByDay['日'],
        isThisWeek: dateByDay['月'] === ISO(mondayOf(parseISO(DATA.today))),
        dateByDay: dateByDay,
        labelByDay: labelByDay,
      };
    }

    // 1コマについて「表示中の週での状態」を求める。
    // 週表示の中核なので、DOM にも大域変数にも触らない純関数として切り出してある
    // （scratchpad の検証ハーネスがこの関数を取り出して直接テストする）。
    //   date   … その週における実施日
    //   inTerm … その日が学期の開講期間内か（期間未設定の学期は判定せず true＝従来どおり表示）
    //   status/substitute/absent … その日の欠員の状態
    function weekStateOf(course, week, termRange, vacancy) {
      var date = week.dateByDay[course.day] || '';
      var r = termRange && termRange[course.term];
      var o = (date && vacancy && vacancy[course.course_id + '|' + date]) || null;
      return {
        date: date,
        inTerm: !r || (!!date && date >= r.start && date <= r.end),
        status: o ? o.status : '通常',
        substitute: o ? o.substitute : '',
        absent: o ? o.absent : [],
      };
    }

    // 表示中の週に合わせて、各コマへ状態を載せ直してから再描画する
    function applyWeek(startISO) {
      WEEK = buildWeek(startISO);
      DATA.courses.forEach(function (c) {
        var s = weekStateOf(c, WEEK, DATA.termRange, DATA.vacancy);
        c.date = s.date;
        c.inTerm = s.inTerm;
        c.status = s.status;
        c.substitute = s.substitute;
        c.absent = s.absent;
      });
      renderWeekBar();
      applyFilters();
    }

    function shiftWeek(deltaWeeks) {
      if (!WEEK) return;
      var d = parseISO(WEEK.start);
      d.setDate(d.getDate() + deltaWeeks * 7);
      applyWeek(ISO(d));
    }

    function goThisWeek() { applyWeek(null); }

    // 週の範囲表示と「今週へ」ボタンの出し分け
    function renderWeekBar() {
      if (!WEEK) return;
      document.getElementById('wkRange').textContent =
        WEEK.labelByDay['月'] + '(月) 〜 ' + WEEK.labelByDay['日'] + '(日)';
      // 今週を見ているときは「今週へ」を出さない（押しても何も変わらないため）
      document.getElementById('wkNow').style.display = WEEK.isThisWeek ? 'none' : '';
      document.getElementById('wkTag').textContent = WEEK.isThisWeek ? '今週' : '';
    }

    function onError(err) {
      var content = document.getElementById('content');
      content.className = 'state';
      content.textContent = 'エラー: ' + err.message;
    }

    function load(quarter) {
      // 学期を変えたときも見ている週は保つ（週はクライアント側の状態）
      var keepWeek = WEEK ? WEEK.start : null;
      document.getElementById('content').className = 'state';
      document.getElementById('content').textContent = '読み込み中…';
      google.script.run
        .withSuccessHandler(function (data) {
          DATA = data;
          fillQuarters();
          fillFilters();
          applyWeek(keepWeek); // 週を載せて VIEW を作り描画
        })
        .withFailureHandler(onError)
        .getTimetable(quarter || null);
    }

    load(null);
  </script>
</body>
</html>
