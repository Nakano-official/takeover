<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include('shared-styles') ?>
  <style>
    :root { --main-max: 560px; }

    label { display: block; font-size: .85rem; font-weight: 700; margin: 16px 0 6px; }
    select, input[type=date] { width: 100%; font-size: 1rem; padding: 10px 11px; }
    /* 欠勤登録は取り消しの効かない操作なので、赤（危険色）のまま目立たせる */
    #submit { margin-top: 22px; }
    .result { margin-top: 18px; padding: 16px; border-radius: var(--radius);
              background: var(--info-bg); border: 1px solid var(--info-border);
              font-size: .9rem; line-height: 1.7; }
    .result.warn { background: var(--warn-bg); border-color: var(--warn-border); }
    .result h2 { font-size: 1rem; margin: 0 0 8px; }
    .cand { display: inline-block; background: var(--brand-soft); color: var(--brand-ink);
            border: 1px solid var(--brand-border); border-radius: var(--radius-pill);
            padding: 2px 10px; margin: 2px 4px 2px 0; font-size: .85rem; }
  </style>
</head>
<body>
  <?!= chrome ?>

  <main>
    <div class="card">
      <div id="form" class="state">担当コマを読み込み中…</div>
    </div>
    <div id="result"></div>
  </main>

  <script>
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    var COURSES = [];  // getMyCourses の戻り（学期範囲つき）を保持

    function todayISO() {
      var t = new Date();
      return t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2);
    }
    function parseISO(s) { var m = String(s).split('-'); return new Date(+m[0], +m[1] - 1, +m[2]); }
    function fmtISO(d) {
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    }

    // コマの曜日に一致し、学期期間内で今日以降の授業日をすべて列挙する
    function classDates(dayJa, startStr, endStr) {
      if (!endStr) return [];
      var W = ['日', '月', '火', '水', '木', '金', '土'];
      var today = new Date(); today.setHours(0, 0, 0, 0);
      var start = startStr ? parseISO(startStr) : new Date(today);
      if (start < today) start = new Date(today);
      var end = parseISO(endStr);
      var out = [], d = new Date(start), guard = 0;
      while (d <= end && guard < 400) {
        if (W[d.getDay()] === dayJa) out.push(fmtISO(d));
        d.setDate(d.getDate() + 1); guard++;
      }
      return out;
    }

    function selectedCourse() {
      var id = document.getElementById('course').value;
      for (var i = 0; i < COURSES.length; i++) if (COURSES[i].course_id === id) return COURSES[i];
      return COURSES[0];
    }

    // 選択中コマに合わせて「欠勤日」の選択肢を組み直す（授業のある日だけ）
    function rebuildDates() {
      var c = selectedCourse();
      var wrap = document.getElementById('dateWrap');
      var btn = document.getElementById('submit');
      var hint = document.getElementById('datehint');
      if (!c.termEnd) {
        // 学期日程が未設定のコマ → 日付直接入力にフォールバック（サーバーが曜日を検証）
        var iso = todayISO();
        wrap.innerHTML = '<input type="date" id="date" min="' + iso + '" value="' + iso + '">';
        btn.disabled = false;
        hint.textContent = 'この授業は学期日程が未設定のため日付を直接選べます（' + c.day + '曜のみ有効）。学期設定への登録を推奨します。';
        return;
      }
      var dates = classDates(c.day, c.termStart, c.termEnd);
      if (dates.length === 0) {
        wrap.innerHTML = '<select id="date"><option value="">（選べる日がありません）</option></select>';
        btn.disabled = true;
        hint.textContent = 'この学期（' + c.termStart + '〜' + c.termEnd + '）に残りの' + c.day + '曜がありません。';
        return;
      }
      wrap.innerHTML = '<select id="date">' + dates.map(function (d) {
        return '<option value="' + d + '">' + d + '（' + c.day + '）</option>';
      }).join('') + '</select>';
      btn.disabled = false;
      hint.textContent = 'この学期に授業のある' + c.day + '曜だけが選べます。';
    }

    // 担当コマを読み込んでフォームを組み立てる
    function buildForm(courses) {
      COURSES = courses || [];
      var form = document.getElementById('form');
      if (!courses || courses.length === 0) {
        form.className = 'state';
        form.textContent = 'あなたが担当しているコマがありません。欠勤連絡は担当コマがある場合のみ行えます。';
        return;
      }
      var opts = courses.map(function (c) {
        var label = c.day + c.period + '限'
          + (c.time ? '（' + c.time + '）' : '')
          + '　相方: ' + (c.partner || '—');
        return '<option value="' + escapeHtml(c.course_id) + '">' + escapeHtml(label) + '</option>';
      }).join('');

      form.className = '';
      form.innerHTML =
        '<label for="course">欠勤するコマ</label>' +
        '<select id="course" onchange="rebuildDates()">' + opts + '</select>' +
        '<label for="date">欠勤日</label>' +
        '<div id="dateWrap"></div>' +
        '<button id="submit" class="btn danger block" onclick="submit()">欠勤を登録して代行候補を探す</button>' +
        '<p class="hint" id="datehint"></p>';
      rebuildDates();
    }

    function submit() {
      var courseId = document.getElementById('course').value;
      var date = document.getElementById('date').value;
      if (!date) { alert('欠勤日を選んでください。'); return; }

      var btn = document.getElementById('submit');
      btn.disabled = true;
      btn.textContent = '登録中…';

      google.script.run
        .withSuccessHandler(onDone)
        .withFailureHandler(onFail)
        .submitAbsence(courseId, date);
    }

    function onDone(res) {
      var box = document.getElementById('result');
      var c = res.course;
      var head = '<h2>✅ 欠員を登録しました</h2>'
        + '<div>欠員ID: ' + escapeHtml(res.vacancy_id) + '（' + escapeHtml(c.day + c.period) + '限）</div>';

      if (res.candidates && res.candidates.length > 0) {
        var chips = res.candidates.map(function (x) {
          return '<span class="cand">' + escapeHtml(x.name) + '</span>';
        }).join('');
        box.className = 'result';
        box.innerHTML = head + '<div style="margin-top:8px;">代行候補（' + res.candidates.length + '名）:<br>' + chips + '</div>'
          + notifyHtml(res.notify);
      } else if (res.autoResult) {
        // 補充候補が0人 → 自動決着（1人テイク / 職員対応）
        box.className = 'result warn';
        box.innerHTML = head + '<div style="margin-top:8px;">空きのある代行候補がいませんでした。'
          + '自動で <b>「' + escapeHtml(res.autoResult) + '」</b> として処理し、職員へ連絡しました。</div>'
          + notifyHtml(res.notify);
      } else {
        box.className = 'result warn';
        box.innerHTML = head + '<div style="margin-top:8px;">⚠️ この時限に空きのある代行候補が見つかりませんでした。職員に相談してください。</div>'
          + notifyHtml(res.notify);
      }

      var btn = document.getElementById('submit');
      btn.textContent = '登録済み';
    }

    // 通知結果を1行で要約表示する
    function notifyHtml(n) {
      if (!n) return '';
      if (n.error) {
        return '<p class="hint">⚠️ 通知処理でエラー: ' + escapeHtml(n.error) + '</p>';
      }
      var sent = (n.candidates || []).filter(function (c) { return c.sent; }).length;
      var total = (n.candidates || []).length;
      var parts = [];
      parts.push(n.staff ? '職員スペースへ通知しました' : '職員スペースへ通知できませんでした');
      if (total > 0) parts.push('候補 ' + sent + '/' + total + ' 名へ送信');
      return '<p class="hint">📨 ' + escapeHtml(parts.join('　／　')) + '</p>';
    }

    function onFail(err) {
      alert('エラー: ' + err.message);
      var btn = document.getElementById('submit');
      btn.disabled = false;
      btn.textContent = '欠勤を登録して代行候補を探す';
    }

    google.script.run.withSuccessHandler(buildForm).withFailureHandler(function (err) {
      document.getElementById('form').textContent = 'エラー: ' + err.message;
    }).getMyCourses();
  </script>
</body>
</html>
