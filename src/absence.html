<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include('shared-styles') ?>
  <style>
    :root { --main-max: 560px; }

    label { display: block; font-size: .85rem; font-weight: 700; margin: 16px 0 6px; }
    select, input[type=date] { width: 100%; font-size: 1rem; padding: 10px 11px; }
    /* 欠勤登録は取り消しの効かない操作なので、赤（危険色）のまま目立たせる */
    #submit { margin-top: 22px; }
    .result { margin-top: 18px; padding: 16px; border-radius: var(--radius);
              background: var(--info-bg); border: 1px solid var(--info-border);
              font-size: .9rem; line-height: 1.7; }
    .result.warn { background: var(--warn-bg); border-color: var(--warn-border); }
    .result h2 { font-size: 1rem; margin: 0 0 8px; }
    /* 学期境界の但し書き（terms は曜日ごとのズレを表現できない・D23） */
    .termnote { font-size: .8rem; color: var(--text-muted); line-height: 1.6;
                margin: 18px 0 0; padding-top: 12px; border-top: 1px solid var(--border); }
    /* 登録前の確認（issue #54）。見た目はヘルプのシートと同じ（スマホは下から・PC は中央） */
    .confirm-dl { display: grid; grid-template-columns: 6.5em 1fr; gap: 8px 12px; margin: 0 0 14px; }
    .confirm-dl dt { color: var(--text-muted); font-size: .82rem; }
    .confirm-dl dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
    .confirm-dl .unset { color: var(--text-faint); font-weight: 400; }
    .confirm-note { font-size: .85rem; line-height: 1.7; color: var(--text-muted); margin: 0; }
    .confirm-foot { justify-content: flex-end; }
    .cand { display: inline-block; background: var(--brand-soft); color: var(--brand-ink);
            border: 1px solid var(--brand-border); border-radius: var(--radius-pill);
            padding: 2px 10px; margin: 2px 4px 2px 0; font-size: .85rem; }
  </style>
</head>
<body>
  <?!= chrome ?>

  <main>
    <div id="prenote"></div>
    <div class="card">
      <div id="form" class="state">担当コマを読み込み中…</div>
      <!-- 欠勤日の候補は terms の開講期間から機械的に列挙しているだけで、
           曜日ごとの学期境界のズレや振替は反映できない（Constants.gs の定数と同じ但し書き）。 -->
      <p class="termnote">※ <?= TERM_BOUNDARY_NOTICE ?></p>
    </div>
    <div id="result"></div>
  </main>

  <!-- 登録前の確認（issue #54）。ここではまだサーバーを呼ばない。「この内容で欠勤を登録」を押したときだけ登録する -->
  <div id="absConfirm" class="help-modal" hidden onclick="if (event.target === this) cancelConfirm()">
    <div class="help-sheet fit" role="dialog" aria-modal="true" aria-labelledby="absConfirmTitle">
      <div class="help-head">
        <h2 id="absConfirmTitle">この内容で欠勤を登録しますか？</h2>
        <button type="button" class="help-x" onclick="cancelConfirm()" aria-label="閉じる">×</button>
      </div>
      <div class="help-body" id="absConfirmBody"></div>
      <div class="help-foot confirm-foot">
        <button type="button" class="btn" onclick="cancelConfirm()">戻って修正</button>
        <button type="button" class="btn danger" id="absConfirmGo" onclick="confirmGo()">この内容で欠勤を登録</button>
      </div>
    </div>
  </div>

  <?!= include('shared-dialog') ?>

  <script>
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    var COURSES = [];  // getMyCourses の戻り（学期範囲つき）を保持

    // 時間割（home）の詳細モーダル「この日の欠勤を連絡する」から来たときの初期選択（D24）。
    // 選ぶ手間を省くだけで、登録の可否はこれまでどおりサーバーが検証する。
    var PRE_COURSE = '<?= params.course || "" ?>';
    var PRE_DATE = '<?= params.date || "" ?>';
    var PRE_PENDING = true;   // 初期選択は最初の組み立てのときだけ適用する
    var PRE_MSG = null;       // 初期選択が効かなかったときの説明 { cls, text }

    function todayISO() {
      var t = new Date();
      return t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2);
    }
    function parseISO(s) { var m = String(s).split('-'); return new Date(+m[0], +m[1] - 1, +m[2]); }
    function fmtISO(d) {
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    }

    // コマの曜日に一致し、学期期間内で今日以降の授業日をすべて列挙する
    // skip … 授業の無い日（祝日・全学休講など・D53）。選択肢から外す
    function classDates(dayJa, startStr, endStr, skip) {
      var skipSet = {};
      (skip || []).forEach(function (d) { skipSet[d] = true; });
      if (!endStr) return [];
      var W = ['日', '月', '火', '水', '木', '金', '土'];
      var today = new Date(); today.setHours(0, 0, 0, 0);
      var start = startStr ? parseISO(startStr) : new Date(today);
      if (start < today) start = new Date(today);
      var end = parseISO(endStr);
      var out = [], d = new Date(start), guard = 0;
      while (d <= end && guard < 400) {
        if (W[d.getDay()] === dayJa && !skipSet[fmtISO(d)]) out.push(fmtISO(d));
        d.setDate(d.getDate() + 1); guard++;
      }
      return out;
    }

    function selectedCourse() {
      var id = document.getElementById('course').value;
      for (var i = 0; i < COURSES.length; i++) if (COURSES[i].course_id === id) return COURSES[i];
      return COURSES[0];
    }

    // 選択中コマに合わせて「欠勤日」の選択肢を組み直す（授業のある日だけ）
    function rebuildDates() {
      renderAttached();
      var c = selectedCourse();
      var wrap = document.getElementById('dateWrap');
      var btn = document.getElementById('submit');
      var hint = document.getElementById('datehint');

      // 単発コマ（D27）は実施日が1つしか無い。学期の開講期間からは日付を組み立てず、
      // その日だけを候補にする（サーバー側 submitAbsence も実施日との一致だけを見る）。
      if (c.oneOffDate) {
        // その日が個別の休講（D60）なら選ばせない（issue #45）。
        // skipDates は見ない：全学の授業の無い日も入っていて、その日に行う単発コマ（補講・行事）まで止めてしまう（issue #49）
        if ((c.cancelledDates || []).indexOf(c.oneOffDate) !== -1) {
          wrap.innerHTML = '<select id="date"><option value="">（' + escapeHtml(c.oneOffDate) + ' は休講です）</option></select>';
          applyPreDate();
          btn.disabled = true;
          hint.textContent = 'このコマは ' + c.oneOffDate + ' の1回限りですが、その日は休講です。欠勤の連絡は要りません。';
          return;
        }
        wrap.innerHTML = '<select id="date"><option value="' + escapeHtml(c.oneOffDate) + '">'
          + escapeHtml(c.oneOffDate) + '</option></select>';
        applyPreDate();
        btn.disabled = false;
        hint.textContent = 'このコマは ' + c.oneOffDate + ' の1回限りです（特別授業・イベント）。';
        return;
      }

      if (!c.termEnd) {
        // 学期日程が未設定のコマ → 日付直接入力にフォールバック（サーバーが曜日を検証）
        var iso = todayISO();
        wrap.innerHTML = '<input type="date" id="date" min="' + iso + '" value="' + iso + '">';
        applyPreDate();
        btn.disabled = false;
        hint.textContent = 'この授業は学期日程が未設定のため日付を直接選べます（' + c.day + '曜のみ有効）。学期設定への登録を推奨します。';
        return;
      }
      var dates = classDates(c.day, c.termStart, c.termEnd, c.skipDates);
      if (dates.length === 0) {
        wrap.innerHTML = '<select id="date"><option value="">（選べる日がありません）</option></select>';
        applyPreDate();   // この経路でも初期選択は消費する（後でコマを変えたときに誤って当たらないように）
        btn.disabled = true;
        hint.textContent = 'この学期（' + c.termStart + '〜' + c.termEnd + '）に残りの' + c.day + '曜がありません。';
        return;
      }
      wrap.innerHTML = '<select id="date">' + dates.map(function (d) {
        return '<option value="' + d + '">' + d + '（' + c.day + '）</option>';
      }).join('') + '</select>';
      applyPreDate();
      btn.disabled = false;
      hint.textContent = 'この学期に授業のある' + c.day + '曜だけが選べます。';
    }

    // 時間割から渡された日付を選択済みにする（最初の1回だけ）。
    // 授業日の一覧に無い日付（学期末より先・過ぎた日など）は当てずに理由を出す。
    function applyPreDate() {
      if (!PRE_PENDING) return;
      PRE_PENDING = false;
      if (!PRE_DATE) return;
      var el = document.getElementById('date');
      if (!el) return;
      if (el.tagName === 'INPUT') { el.value = PRE_DATE; return; }  // 日付直接入力へのフォールバック
      var ok = Array.prototype.some.call(el.options, function (o) { return o.value === PRE_DATE; });
      if (ok) el.value = PRE_DATE;
      else PRE_MSG = { cls: 'warn', text: '時間割で選んだ日付（' + PRE_DATE +
        '）は、このコマで選べる授業日に含まれていませんでした。日付を選び直してください。' };
    }

    // 初期選択が効いたか／効かなかったかをフォームの上に出す
    function renderPreNote() {
      var el = document.getElementById('prenote');
      if (PRE_MSG) {
        el.innerHTML = '<div class="notice ' + PRE_MSG.cls + '" style="margin-bottom:14px">' +
          escapeHtml(PRE_MSG.text) + '</div>';
      } else if (PRE_COURSE || PRE_DATE) {
        el.innerHTML = '<div class="notice info" style="margin-bottom:14px">' +
          '時間割から選びました。内容を確認して、下のボタンを押してください。</div>';
      }
    }

    // 担当コマを読み込んでフォームを組み立てる
    function buildForm(courses) {
      COURSES = courses || [];
      var form = document.getElementById('form');
      if (!courses || courses.length === 0) {
        form.className = 'state';
        form.textContent = 'あなたが担当しているコマがありません。欠勤連絡は担当コマがある場合のみ行えます。';
        return;
      }
      var opts = courses.map(function (c) {
        var label = (c.oneOffDate ? '【' + c.oneOffDate + '】' : '') + c.day
          + (c.periodLabel || (c.period + '限'))
          + (c.time ? '（' + c.time + '）' : '')
          + '　相方: ' + (c.partner || '—');
        return '<option value="' + escapeHtml(c.course_id) + '">' + escapeHtml(label) + '</option>';
      }).join('');

      form.className = '';
      form.innerHTML =
        '<label for="course">欠勤するコマ</label>' +
        '<select id="course" onchange="rebuildDates()">' + opts + '</select>' +
        '<label for="date">欠勤日</label>' +
        '<div id="dateWrap"></div>' +
        '<div id="attachBox" style="display:none">' +
          '<label style="font-weight:600;cursor:pointer;display:block;margin:10px 0 0">' +
          '<input type="checkbox" id="withAttached" checked style="width:auto">' +
          '<span id="attachLabel"></span></label>' +
          '<p class="hint" id="attachHint" style="margin:4px 0 0"></p></div>' +
        '<button id="submit" class="btn danger block" onclick="submit()">欠勤を登録して代行候補を探す</button>' +
        '<p class="hint" id="datehint"></p>';

      // 時間割から来ていれば、そのコマを選んだ状態にする。
      // 担当コマ一覧（現在の学期のみ）に無ければ当てず、理由を出して既定のコマのままにする。
      if (PRE_COURSE) {
        var found = COURSES.some(function (x) { return x.course_id === PRE_COURSE; });
        if (found) document.getElementById('course').value = PRE_COURSE;
        else PRE_MSG = { cls: 'warn', text: '時間割で選んだコマが、いまの担当コマ一覧に見つかりませんでした。' +
          'コマと日付を選び直してください。' };
      }
      rebuildDates();   // この中で applyPreDate が日付を当てる
      renderPreNote();
    }

    /**
     * 選んだコマに移動介助がくっついていれば、「一緒に休む」を出す（D45）。
     *
     * 介助の担当が休むと、授業だけでなく前後の移動も同じ人の仕事なので一緒に欠員になる。
     * **既定はオン**（実務では「どちらかに出られないならその日は休む」）。
     * 移動だけ／授業だけ休むときはチェックを外す。
     */
    function renderAttached() {
      var box = document.getElementById('attachBox');
      if (!box) return;
      var c = currentCourse();
      var list = (c && c.attached) || [];
      if (list.length === 0) { box.style.display = 'none'; return; }
      box.style.display = '';
      document.getElementById('attachLabel').textContent =
        '　前後の移動介助（' + list.join('・') + '）も一緒に休む';
      document.getElementById('attachHint').textContent =
        'まとめて1つの代行募集になります（通知は1回、承諾した人がすべて引き受けます）。'
        + 'この授業だけ休む場合はチェックを外してください。';
    }

    function currentCourse() {
      var id = document.getElementById('course').value;
      return COURSES.filter(function (x) { return x.course_id === id; })[0] || null;
    }

    // 確認に出した内容（{courseId, date, withAttached}）。登録はこの値で送る＝確認したものと送るものが食い違わない
    var PENDING = null;
    var SENDING = false;   // 二重に送らない

    // 「欠勤を登録」→ まず確認を出す（issue #54）。ここではサーバーを呼ばない
    function submit() {
      if (SENDING) return;
      var courseId = document.getElementById('course').value;
      var date = document.getElementById('date').value;
      if (!date) { alert('欠勤日を選んでください。'); return; }
      var box = document.getElementById('attachBox');
      var withAttached = !(box && box.style.display !== 'none')
        ? false : document.getElementById('withAttached').checked;
      var c = currentCourse() || {};
      PENDING = { courseId: courseId, date: date, withAttached: withAttached };

      var W = ['日', '月', '火', '水', '木', '金', '土'];
      var wd = W[parseISO(date).getDay()] || '';
      var orUnset = function (s) { return s ? escapeHtml(s) : '<span class="unset">未設定</span>'; };
      var rows = [
        ['欠勤日', escapeHtml(date + '（' + wd + '）')],
        ['コマ', escapeHtml((c.periodLabel || (c.period + '限')) + (c.time ? '（' + c.time + '）' : ''))],
        ['業務', orUnset(c.support_type)],
        ['利用者', orUnset(c.user_student)],
        ['科目', orUnset(c.subject)],
        ['教室', orUnset(c.room)],
      ];
      if (withAttached && c.attached && c.attached.length) {
        rows.push(['一緒に休む', escapeHtml('前後の移動介助（' + c.attached.join('・') + '）')]);
      }
      document.getElementById('absConfirmBody').innerHTML =
        '<dl class="confirm-dl">' + rows.map(function (r) { return '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>'; }).join('') + '</dl>' +
        // 実際の動きと合わせる：職員へは必ず知らせる。代行の募集は締切（授業開始の N 分前）より前のときだけ
        '<p class="confirm-note">登録すると職員へ知らせます。授業開始の<?= RECRUIT_DEADLINE_MIN_BEFORE ?>分前より前なら、' +
        '空いている代行候補にも代行を依頼します（過ぎていたら代行の募集はしません）。<br>' +
        '<b>登録した欠勤は、自分では取り消せません。</b></p>';

      var modal = document.getElementById('absConfirm');
      modal.hidden = false;
      document.body.classList.add('help-open');   // 後ろの画面をスクロールさせない（ヘルプと同じ）
      document.getElementById('absConfirmGo').disabled = false;
      dialogOpen(modal, document.getElementById('absConfirmGo'));
    }

    // 「戻って修正」：何も送らずに閉じる。入力はそのまま
    function cancelConfirm() {
      var modal = document.getElementById('absConfirm');
      if (modal.hidden || SENDING) return;
      PENDING = null;
      modal.hidden = true;
      document.body.classList.remove('help-open');
      dialogClose(modal);
    }

    // 「この内容で欠勤を登録」：確認に出した値で、1回だけ送る
    function confirmGo() {
      if (!PENDING || SENDING) return;
      SENDING = true;
      var p = PENDING;
      PENDING = null;
      document.getElementById('absConfirmGo').disabled = true;
      var modal = document.getElementById('absConfirm');
      modal.hidden = true;
      document.body.classList.remove('help-open');
      dialogClose(modal);

      var btn = document.getElementById('submit');
      btn.disabled = true;
      btn.textContent = '登録中…';

      google.script.run
        .withSuccessHandler(onDone)
        .withFailureHandler(onFail)
        .submitAbsence(p.courseId, p.date, p.withAttached);
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') cancelConfirm();
    });

    function onDone(res) {
      SENDING = false;   // 別のコマを選び直せば、続けて登録できる（今まで通り）
      var box = document.getElementById('result');
      var c = res.course;
      var head = '<h2>✅ 欠員を登録しました</h2>'
        + '<div>欠員ID: ' + escapeHtml(res.vacancy_id) + '（'
        + escapeHtml(c.day + (c.periodLabel || (c.period + '限'))) + '）</div>';

      if (res.lateAbsence) {
        // 締切超過（授業開始 N 分前を過ぎた直前欠勤）。代行依頼は送っていないので、
        // 従来どおり Google Classroom へも連絡してもらうよう案内する。
        box.className = 'result warn';
        box.innerHTML = '<h2>⚠️ 欠勤を登録しました（代行の募集は行いません）</h2>'
          + '<div>欠員ID: ' + escapeHtml(res.vacancy_id) + '（'
          + escapeHtml(c.day + (c.periodLabel || (c.period + '限'))) + '）</div>'
          + '<div style="margin-top:8px;">授業開始が近いため（' + escapeHtml(res.deadlineMinutes)
          + '分前を過ぎています）、代行候補者への依頼は送っていません。'
          + '<b>職員へ連絡済みです。この後の対応（1人テイク／職員対応）は職員が決めます。</b></div>'
          + '<div style="margin-top:8px;"><b>お手数ですが、Google Classroom にも欠勤の連絡を投稿してください。</b></div>'
          + notifyHtml(res.notify);
      } else if (res.candidates && res.candidates.length > 0) {
        var chips = res.candidates.map(function (x) {
          return '<span class="cand">' + escapeHtml(x.name) + '</span>';
        }).join('');
        box.className = 'result';
        box.innerHTML = head + '<div style="margin-top:8px;">代行候補（' + res.candidates.length + '名）:<br>' + chips + '</div>'
          + notifyHtml(res.notify);
      } else if (res.recruitClosed) {
        // 補充候補が0人 → 募集はせず、職員へ決着を要求する（D22）。
        // 以前はここで「1人テイク／職員対応」まで自動で決めていたが、その判断は職員が行う。
        box.className = 'result warn';
        box.innerHTML = head + '<div style="margin-top:8px;">空きのある代行候補がいませんでした。'
          + '<b>職員へ連絡済みです。この後の対応は職員が決めます。</b></div>'
          + notifyHtml(res.notify);
      } else {
        box.className = 'result warn';
        box.innerHTML = head + '<div style="margin-top:8px;">⚠️ この時限に空きのある代行候補が見つかりませんでした。職員に相談してください。</div>'
          + notifyHtml(res.notify);
      }

      var btn = document.getElementById('submit');
      btn.textContent = '登録済み';
    }

    // 通知結果を1行で要約表示する
    function notifyHtml(n) {
      if (!n) return '';
      if (n.error) {
        return '<p class="hint">⚠️ 通知処理でエラー: ' + escapeHtml(n.error) + '</p>';
      }
      var sent = (n.candidates || []).filter(function (c) { return c.sent; }).length;
      var total = (n.candidates || []).length;
      var parts = [];
      parts.push(n.staff ? '職員スペースへ通知しました' : '職員スペースへ通知できませんでした');
      if (total > 0) parts.push('候補 ' + sent + '/' + total + ' 名へ送信');
      return '<p class="hint">📨 ' + escapeHtml(parts.join('　／　')) + '</p>';
    }

    function onFail(err) {
      SENDING = false;   // 送れなかったので、もう一度押せるように戻す
      alert('エラー: ' + err.message);
      var btn = document.getElementById('submit');
      btn.disabled = false;
      btn.textContent = '欠勤を登録して代行候補を探す';
    }

    google.script.run.withSuccessHandler(buildForm).withFailureHandler(function (err) {
      document.getElementById('form').textContent = 'エラー: ' + err.message;
    }).getMyCourses();
  </script>
</body>
</html>
