<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body { font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", sans-serif;
           margin: 0; background: #f5f6f8; color: #222; }
    header { background: #4a86e8; color: #fff; padding: 14px 16px; }
    header h1 { font-size: 1.1rem; margin: 0; }
    header .user { font-size: .8rem; opacity: .9; margin-top: 2px; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: #fff;
          border-bottom: 1px solid #e3e6ea; }
    nav a { font-size: .85rem; text-decoration: none; color: #4a86e8;
            border: 1px solid #cdddfb; border-radius: 999px; padding: 5px 12px; }
    nav a:hover { background: #eef4ff; }
    main { padding: 16px; max-width: 760px; margin: 0 auto; }
    .card { background: #fff; border-radius: 8px; padding: 18px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
            margin-bottom: 16px; }
    .card h2 { font-size: 1rem; margin: 0 0 12px; }
    .hint { font-size: .78rem; color: #888; margin: 6px 0 0; line-height: 1.6; }

    label { display: block; font-size: .8rem; font-weight: 600; margin: 0 0 4px; }
    input { padding: 8px 10px; font-size: .95rem; border: 1px solid #cdd3da; border-radius: 6px;
            background: #fff; font-family: inherit; }
    .addbar { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
    .btn2 { padding: 9px 16px; font-size: .9rem; font-weight: 600; color: #fff; background: #2a63c0;
            border: none; border-radius: 6px; cursor: pointer; }
    .btn2:disabled { background: #9db8e3; cursor: default; }
    .btn-save { padding: 7px 14px; font-size: .82rem; font-weight: 600; color: #fff; background: #1e7a3d;
                border: none; border-radius: 6px; cursor: pointer; }
    .btn-save:disabled { background: #a9cdb6; cursor: default; }
    .btn-del { padding: 7px 12px; font-size: .82rem; font-weight: 600; color: #c0392b; background: #fff;
               border: 1px solid #e3b4ae; border-radius: 6px; cursor: pointer; }
    .btn-del:hover { background: #fdf1f0; }
    .btn-del:disabled { color: #c9a7a3; border-color: #efe0de; background: #fff; cursor: default; }

    .status { padding: 12px 14px; border-radius: 8px; font-size: .9rem; line-height: 1.6; }
    .status.ok { background: #eaf7ee; border: 1px solid #bfe6cb; color: #1e7a3d; }
    .status.warn { background: #fff5e6; border: 1px solid #f2d69a; color: #9a6a00; }

    .toast { margin-top: 12px; padding: 12px 14px; border-radius: 8px; font-size: .9rem; display: none; }
    .toast.ok { display: block; background: #eaf7ee; border: 1px solid #bfe6cb; color: #1e7a3d; }
    .toast.err { display: block; background: #fdecea; border: 1px solid #f5c6c0; color: #c0392b; }

    .trow { padding: 12px 0; border-top: 1px solid #eef1f4; }
    .trow:first-child { border-top: none; }
    .trow .tid { font-size: .92rem; margin-bottom: 8px; }
    .trow .tid b { color: #2a63c0; }
    .sys { display: inline-block; font-size: .7rem; padding: 1px 8px; border-radius: 999px;
           background: #eef1f4; color: #555; margin-left: 6px; }
    .cur { display: inline-block; font-size: .7rem; padding: 1px 8px; border-radius: 999px;
           background: #2a63c0; color: #fff; margin-left: 6px; }
    .dates { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
    .yhead { font-size: .82rem; font-weight: 700; color: #444; margin: 14px 0 2px; }
    .state { padding: 18px; text-align: center; color: #888; }
    .rtoast { font-size: .78rem; margin-left: 4px; }
    .rtoast.ok { color: #1e7a3d; }
    .rtoast.err { color: #c0392b; }
  </style>
</head>
<body>
  <header>
    <h1>学期設定</h1>
    <div class="user"><?= user.name ?> さん（<?= user.role ?>）</div>
  </header>

  <nav>
    <a href="<?= appUrl ?>?page=home">シフト確認</a>
    <a href="<?= appUrl ?>?page=input">シフト入力</a>
    <a href="<?= appUrl ?>?page=manage">欠員補充管理</a>
    <a href="<?= appUrl ?>?page=check">整合性チェック</a>
    <a href="<?= appUrl ?>?page=terms">学期設定</a>
  </nav>

  <main>
    <div class="card">
      <div id="status" class="status">読み込み中…</div>
      <p class="hint">
        学期の開始日・終了日は「今どの学期のシフトを表示するか」の判定に使われます。
        年度ごとに実際の学事暦（履修登録の区分）に合わせて設定してください。
        表はスプレッドシートを直接触らず、この画面から編集できます。
      </p>
    </div>

    <div class="card">
      <h2>年度を追加</h2>
      <p class="hint">
        新しい年度の学期（前期・後期＋1Q〜4Q の6件）を雛形の日付で追加します。
        追加後、各行の開始日・終了日を実際の学事暦に合わせて調整してください。
        既にある学期は重複追加されません。
      </p>
      <div class="addbar" style="margin-top:12px">
        <div>
          <label for="year">年度（西暦）</label>
          <input id="year" type="number" min="2020" max="2099" style="max-width:140px">
        </div>
        <button class="btn2" id="addBtn" onclick="addYear()">この年度を追加</button>
      </div>
      <div id="addToast" class="toast"></div>
    </div>

    <div class="card">
      <h2>登録済みの学期</h2>
      <div id="list" class="state">読み込み中…</div>
    </div>
  </main>

  <script>
    var DATA = null;

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function load() {
      google.script.run
        .withSuccessHandler(onData)
        .withFailureHandler(function (err) {
          document.getElementById('list').textContent = 'エラー: ' + err.message;
        })
        .getTermsAdmin();
    }

    function onData(data) {
      DATA = data;
      renderStatus();
      renderList();
      if (!document.getElementById('year').value) {
        document.getElementById('year').value = data.suggestYear || '';
      }
    }

    function renderStatus() {
      var el = document.getElementById('status');
      if (DATA.hasCurrent) {
        el.className = 'status ok';
        el.innerHTML = '✅ 本日（' + escapeHtml(DATA.today) + '）を含む学期が設定されています。'
          + 'シフト確認は現在の学期として正しく表示されます。';
      } else {
        el.className = 'status warn';
        el.innerHTML = '⚠️ 本日（' + escapeHtml(DATA.today) + '）を含む学期がありません。'
          + 'このままだと「現在」の判定ができず、シフト確認が過去の学期のまま表示される場合があります。'
          + '下で今年度の日付を設定してください。';
      }
    }

    function renderList() {
      var host = document.getElementById('list');
      var terms = DATA.terms || [];
      if (!terms.length) {
        host.className = 'state';
        host.textContent = 'まだ学期が登録されていません。上の「年度を追加」から作成してください。';
        return;
      }
      host.className = '';
      // 年度ごとに見出しを付けて並べる（開始日の新しい順）
      var html = '';
      var lastYear = null;
      terms.forEach(function (t) {
        var m = String(t.term_id).match(/^(\d{4})/);
        var yr = m ? m[1] : '—';
        if (yr !== lastYear) {
          html += '<div class="yhead">' + escapeHtml(yr) + ' 年度</div>';
          lastYear = yr;
        }
        var idAttr = escapeHtml(t.term_id);
        html +=
          '<div class="trow" data-tid="' + idAttr + '">' +
            '<div class="tid"><b>' + escapeHtml(t.term_id) + '</b>' +
              (t.systemLabel ? '<span class="sys">' + escapeHtml(t.systemLabel) + '</span>' : '') +
              (t.isCurrent ? '<span class="cur">現在</span>' : '') +
            '</div>' +
            '<div class="dates">' +
              '<div><label>開始日</label>' +
                '<input type="date" class="st" value="' + escapeHtml(t.start_date) + '"></div>' +
              '<div><label>終了日</label>' +
                '<input type="date" class="en" value="' + escapeHtml(t.end_date) + '"></div>' +
              '<button class="btn-save" onclick="saveRow(this)">保存</button>' +
              '<button class="btn-del" onclick="delRow(this)"' + (t.used ? ' disabled title="授業が登録されているため削除できません"' : '') + '>削除</button>' +
              '<span class="rtoast"></span>' +
            '</div>' +
          '</div>';
      });
      host.innerHTML = html;
    }

    function saveRow(btn) {
      var row = btn.closest('.trow');
      var termId = row.getAttribute('data-tid');
      var start = row.querySelector('.st').value;
      var end = row.querySelector('.en').value;
      var msg = row.querySelector('.rtoast');
      if (!start || !end) { rowMsg(msg, '日付を入力してください。', false); return; }
      if (start > end) { rowMsg(msg, '開始日が終了日より後です。', false); return; }

      btn.disabled = true; btn.textContent = '保存中…';
      google.script.run
        .withSuccessHandler(function () {
          btn.disabled = false; btn.textContent = '保存';
          rowMsg(msg, '保存しました。', true);
          load(); // 「現在」印を反映するため再読込
        })
        .withFailureHandler(function (err) {
          btn.disabled = false; btn.textContent = '保存';
          rowMsg(msg, err.message, false);
        })
        .updateTermDates(termId, start, end);
    }

    function delRow(btn) {
      var row = btn.closest('.trow');
      var termId = row.getAttribute('data-tid');
      var msg = row.querySelector('.rtoast');
      if (!confirm(termId + ' を削除しますか？（授業が登録されている学期は削除できません）')) return;
      btn.disabled = true; btn.textContent = '削除中…';
      google.script.run
        .withSuccessHandler(function () {
          rowMsg(msg, '削除しました。', true);
          load(); // 一覧を更新
        })
        .withFailureHandler(function (err) {
          btn.disabled = false; btn.textContent = '削除';
          rowMsg(msg, err.message, false);
        })
        .deleteTerm(termId);
    }

    function rowMsg(el, text, ok) {
      el.className = 'rtoast ' + (ok ? 'ok' : 'err');
      el.textContent = text;
    }

    function addYear() {
      var y = document.getElementById('year').value.trim();
      var t = document.getElementById('addToast');
      if (!/^\d{4}$/.test(y)) { showToast(t, '年度は西暦4桁で入力してください。', false); return; }
      var btn = document.getElementById('addBtn');
      btn.disabled = true; btn.textContent = '追加中…';
      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false; btn.textContent = 'この年度を追加';
          if (res.added > 0) {
            showToast(t, res.year + ' 年度を ' + res.added + ' 件追加しました'
              + (res.skipped ? '（既存 ' + res.skipped + ' 件はスキップ）' : '')
              + '。下の一覧で日付を実際の学事暦に合わせてください。', true);
          } else {
            showToast(t, res.year + ' 年度は既に登録済みです（追加なし）。', true);
          }
          load();
        })
        .withFailureHandler(function (err) {
          btn.disabled = false; btn.textContent = 'この年度を追加';
          showToast(t, err.message, false);
        })
        .addTermsYear(y);
    }

    function showToast(el, msg, ok) {
      el.className = 'toast ' + (ok ? 'ok' : 'err');
      el.textContent = msg;
    }

    load();
  </script>
</body>
</html>
