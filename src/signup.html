<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include('shared-styles') ?>
  <style>
    :root { --main-max: 720px; }

    label { display: block; font-size: .85rem; font-weight: 700; margin: 0 0 6px; }
    input, textarea { width: 100%; }
    textarea { resize: vertical; min-height: 64px; }
    .field { margin-bottom: 16px; }
    h2 { font-size: 1rem; margin: 0 0 4px; }
    .lead { font-size: .88rem; color: var(--text-muted); margin: 0 0 14px; line-height: 1.8; }
    .mail { font-weight: 700; color: var(--brand-ink); }

    .checks { display: flex; gap: 16px; flex-wrap: wrap; }
    .checks label { display: inline-flex; align-items: center; gap: 6px;
                    font-weight: normal; margin: 0; }
    .checks input { width: auto; }

    .grid-wrap { overflow-x: auto; }
    table.slots { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 380px; }
    table.slots th, table.slots td { border-right: 1px solid var(--border);
                                     border-bottom: 1px solid var(--border); text-align: center; }
    table.slots tr > *:last-child { border-right: none; }
    table.slots thead th { background: var(--brand); color: #fff; padding: 7px 4px;
                           font-size: .88rem; font-weight: 600; border-color: var(--brand-dark); }
    table.slots .ph { background: var(--surface-alt); font-size: .82rem; font-weight: 600;
                      padding: 6px 8px; white-space: nowrap; text-align: right; }
    table.slots .ph small { display: block; color: var(--text-faint); font-weight: normal; font-size: .7rem; }
    table.slots td { padding: 0; }
    table.slots td label { display: block; margin: 0; padding: 10px 4px; cursor: pointer; }
    table.slots td label:hover { background: var(--brand-soft); }
    table.slots input { width: auto; }

    .name2 { display: flex; gap: 10px; max-width: 420px; }
    .name2 > div { flex: 1 1 0; min-width: 0; }
    .name2 label { font-weight: 400; font-size: .8rem; color: var(--text-muted); margin-bottom: 3px; }

    /* 業務の切り替えタブ（マイページと同じ形） */
    .tabs { display: flex; gap: 6px; margin: 0 0 12px; border-bottom: 2px solid var(--border); }
    .tab { appearance: none; border: none; background: none; font-family: inherit;
           font-size: .92rem; font-weight: 700; color: var(--text-muted); cursor: pointer;
           padding: 9px 16px; border-bottom: 3px solid transparent; margin-bottom: -2px; }
    .tab:hover { color: var(--brand-ink); background: var(--brand-soft); }
    .tab.on { color: var(--brand-ink); border-bottom-color: var(--brand); }
    .tab .n { font-weight: normal; font-size: .82rem; color: var(--text-faint); margin-left: 5px; }
    .tab.on .n { color: var(--brand-ink); }
    .pane[hidden] { display: none; }

    .toast { margin-top: 14px; display: none; }
    .toast.show { display: block; }

    /* Google Chat アプリの案内（shared-chat-install.html） */
    .chat-install { margin-bottom: 16px; padding: 14px 16px; background: var(--surface-alt);
                    border: 1px solid var(--border); border-radius: var(--radius); }
    .chat-install[hidden] { display: none; }
    .chat-stores { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
    .chat-store { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 150px; }
    .chat-store-name { font-size: .82rem; font-weight: 700; text-align: center; }
    .chat-qr svg { display: block; width: 150px; height: 150px; background: #fff;
                   border: 1px solid var(--border); border-radius: var(--radius-sm); }
  </style>
</head>
<body>
  <?!= chrome ?>

  <main>
    <div id="body" class="state">読み込み中…</div>
    <?!= include('shared-chat-install') ?>
  </main>

  <?!= include('shared-contact') ?>
  <script>
    var C = null;

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function escapeAttr(s) {
      return escapeHtml(s).replace(/'/g, '&#39;').replace(/"/g, '&quot;');
    }
    function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }

    function render(c) {
      C = c;
      var host = document.getElementById('body');
      var chat = document.getElementById('chatInstall');
      host.parentNode.appendChild(chat);     // 描き直しで一緒に消えないよう、いったん元の場所（最後）へ戻す
      chat.hidden = !!c.alreadyRegistered;   // 登録済みの人には出さない

      if (c.alreadyRegistered) {
        host.className = '';
        host.innerHTML = '<div class="card"><h2>登録は済んでいます</h2>' +
          '<p class="lead">このアカウントは既に利用登録されています。' +
          '画面を再読み込みするとシフト確認が開きます。</p>' +
          '<button class="btn primary block" onclick="location.reload()">再読み込み</button></div>';
        return;
      }

      // 申請中は内容を見せつつ、間違いに気づいたら出し直せるようにする
      var statusCard = '';
      if (c.status === '申請中') {
        statusCard = '<div class="notice info" style="margin-bottom:16px">' +
          '<b>申請を受け付けています。</b>職員の承認をお待ちください' +
          (c.appliedAt ? '（申請日時: ' + escapeHtml(c.appliedAt) + '）' : '') + '。<br>' +
          '内容に間違いがあれば、下の欄を直して出し直せます。</div>';
      } else if (c.status === '却下') {
        statusCard = '<div class="notice warn" style="margin-bottom:16px">' +
          '<b>前回の申請は承認されませんでした。</b>' +
          (c.rejectReason ? '<br>理由: ' + escapeHtml(c.rejectReason) : '') +
          '<br>内容を確認して、もう一度申請できます。</div>';
      }

      // 前回の申請を出し直すときは、保存済みの氏名を姓と名へ分けて戻す
      var nameParts = String(c.name || '').trim().split(/[\s　]+/);

      host.className = '';
      host.innerHTML = statusCard +
        '<div class="card">' +
        '<h2>利用登録の申請</h2>' +
        '<p class="lead">このアカウント（<span class="mail">' + escapeHtml(c.email) + '</span>）は' +
        'まだ名簿に登録されていません。下の内容で申請すると、<b>職員が確認して承認します</b>。' +
        '承認されるまでは他の画面は使えません。</p>' +

        '<div class="field"><label>氏名<span style="color:var(--danger)">*</span></label>' +
          '<div class="name2">' +
            '<div><label for="family">姓</label><input id="family" placeholder="龍谷" value="'
              + escapeAttr(nameParts[0] || '') + '"></div>' +
            '<div><label for="given">名</label><input id="given" placeholder="太郎" value="'
              + escapeAttr(nameParts.slice(1).join('')) + '"></div>' +
          '</div>' +
          '<p class="hint">勤務実績の照合に使うので、大学に届け出ている氏名で入れてください。</p></div>' +

        phoneFieldHtml(c.phone, '代行の返事が無いときに職員から連絡することがあります。') +

        '<div class="field"><label for="webhook">Google Chat の通知先URL</label>' +
          webhookHelpButton() +
          '<input id="webhook" type="url" placeholder="https://chat.googleapis.com/..." value="'
            + escapeAttr(c.webhook_url) + '">' +
          '<p class="hint">承認されると、代行のお願いがここへ届きます。' +
          '空のままでも申請はできますが、通知は届きません（あとからマイページで登録できます）。</p></div>' +

        '<div class="field"><label>対応できる業務</label>' +
          '<div class="checks">' +
          skillBox('テイク', c.skills) + skillBox('介助', c.skills) +
          '</div>' +
          '<p class="hint">申告内容は職員が確認して確定します。</p></div>' +

        renderSlots(c) +

        '<div class="field"><label for="note">職員への連絡事項</label>' +
          '<textarea id="note" placeholder="任意">' + escapeHtml(c.note) + '</textarea></div>' +

        '<button class="btn primary block" id="submit" onclick="submitForm()">' +
          (c.status === '申請中' ? 'この内容で出し直す' : 'この内容で申請する') + '</button>' +
        '<div id="toast" class="toast"></div>' +
        '</div>';

      // 申請ボタンのすぐ上に出す（押す前に必ず目に入るように）
      var submit = document.getElementById('submit');
      submit.parentNode.insertBefore(chat, submit);
    }

    function skillBox(name, current) {
      var on = String(current || '').indexOf(name) !== -1;
      return '<label><input type="checkbox" data-skill="' + escapeAttr(name) + '"'
        + (on ? ' checked' : '') + '>' + escapeHtml(name) + '</label>';
    }

    // 空きコマは業務ごとに聞く（テイクと介助で空いている時間が違う・D32・D54）。形はマイページと同じ。
    function renderSlots(c) {
      var types = c.supportTypes || [];
      var count = function (t) { return ((c.slotsByType || {})[t] || []).length; };
      var tabs = types.map(function (t, i) {
        return '<button type="button" class="tab' + (i === 0 ? ' on' : '') + '" data-tab="' + escapeAttr(t) + '">'
          + escapeHtml(t) + '<span class="n" data-count="' + escapeAttr(t) + '">' + count(t) + '</span></button>';
      }).join('');
      var panes = types.map(function (t, i) {
        return '<div class="pane" data-pane="' + escapeAttr(t) + '"' + (i === 0 ? '' : ' hidden') + '>'
          + slotGrid(c, t) + '</div>';
      }).join('');
      return '<div class="field"><label>空きコマ</label>' +
        '<p class="hint" style="margin:0 0 8px">授業が入っていない＝<b>代行に入れる可能性がある</b>コマに' +
        'チェックしてください。<b>テイクと介助は別々に登録します。</b>タブで切り替えてください。' +
        '後からマイページで変更できます。</p>' +
        '<div class="tabs">' + tabs + '</div>' + panes + '</div>';
    }

    function slotGrid(c, type) {
      var chosen = {};
      ((c.slotsByType || {})[type] || []).forEach(function (s) { chosen[s] = true; });
      var periods = (c.periods || []).filter(function (per) {
        return (per.supportTypes || []).indexOf(type) !== -1;
      });
      var h = '<div class="grid-wrap"><table class="slots"><thead><tr><th class="ph"></th>';
      c.days.forEach(function (d) { h += '<th>' + escapeHtml(d) + '</th>'; });
      h += '</tr></thead><tbody>';
      periods.forEach(function (per) {
        h += '<tr><th class="ph">' + escapeHtml(per.label || (per.period + '限'))
          + (per.time ? '<small>' + escapeHtml(per.time) + '</small>' : '') + '</th>';
        c.days.forEach(function (d) {
          var key = d + per.period;
          h += '<td><label><input type="checkbox" data-type="' + escapeAttr(type) + '"'
            + ' data-slot="' + escapeAttr(key) + '"' + (chosen[key] ? ' checked' : '') + '></label></td>';
        });
        h += '</tr>';
      });
      return h + '</tbody></table></div>';
    }

    // タブの切り替え。再描画しないので入力途中の内容は消えない
    document.addEventListener('click', function (ev) {
      var tab = ev.target && ev.target.closest ? ev.target.closest('.tab[data-tab]') : null;
      if (!tab) return;
      var name = tab.getAttribute('data-tab');
      document.querySelectorAll('.tab[data-tab]').forEach(function (b) { b.classList.toggle('on', b === tab); });
      document.querySelectorAll('.pane[data-pane]').forEach(function (el) {
        el.hidden = el.getAttribute('data-pane') !== name;
      });
    });
    document.addEventListener('change', function (ev) {
      if (!ev.target || !ev.target.hasAttribute || !ev.target.hasAttribute('data-slot')) return;
      document.querySelectorAll('.n[data-count]').forEach(function (el) {
        el.textContent = pickedSlots(el.getAttribute('data-count')).length;
      });
    });

    function pickedSlots(type) {
      var out = [];
      document.querySelectorAll('input[data-type="' + type + '"]').forEach(function (b) {
        if (b.checked) out.push(b.getAttribute('data-slot'));
      });
      return out;
    }

    function pickedSkills() {
      var out = [];
      document.querySelectorAll('input[data-skill]').forEach(function (b) {
        if (b.checked) out.push(b.getAttribute('data-skill'));
      });
      return out;
    }

    function submitForm() {
      if (!val('family').trim() || !val('given').trim()) {
        showToast('姓と名を入力してください。', false);
        return;
      }
      var phoneErr = phoneError();
      if (phoneErr) { showToast(phoneErr, false); return; }
      var btn = document.getElementById('submit');
      btn.disabled = true;
      btn.textContent = '送信中…';
      google.script.run
        .withSuccessHandler(function () {
          btn.textContent = '申請しました';
          showToast('申請を受け付けました。職員の承認をお待ちください。', true);
          setTimeout(function () { location.reload(); }, 1500);
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          btn.textContent = 'この内容で申請する';
          showToast(err.message, false);
        })
        .submitRegistration({
          family_name: val('family').trim(),
          given_name: val('given').trim(),
          phone: phoneValue(),
          webhook_url: val('webhook').trim(),
          skills: pickedSkills().join(','),
          slotsByType: { 'テイク': pickedSlots('テイク'), '介助': pickedSlots('介助') },
          note: val('note').trim(),
        });
    }

    function showToast(text, ok) {
      var t = document.getElementById('toast');
      t.className = 'notice toast show ' + (ok ? 'ok' : 'err');
      t.textContent = text;
      t.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    google.script.run
      .withSuccessHandler(render)
      .withFailureHandler(function (err) {
        var host = document.getElementById('body');
        host.className = 'state';
        host.textContent = 'エラー: ' + err.message;
      })
      .getSignupContext();
  </script>
</body>
</html>
