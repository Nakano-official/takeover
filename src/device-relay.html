<!doctype html>
<html lang="ja"><head><base target="_top"><meta charset="utf-8">
<style>body{font-family:sans-serif;max-width:720px;margin:40px auto;padding:20px;line-height:1.8}#status{padding:20px;background:#eef2f8}</style>
</head><body>
<h1>USB欠員通知</h1>
<p>この画面を開いたまま、M5StackをPCにUSB接続してください。</p>
<p id="status">PC中継プログラムの開始を待っています。</p>
<p>PCのスリープ中・ログアウト中は通知できません。</p>
<script>
window.shiftUsbRelayVersion = 1;
window.readShiftUsbSummary = function () {
  document.getElementById('status').textContent = '欠員情報を確認中…';
  return new Promise(function (resolve, reject) {
    var finished = false;
    var timer = setTimeout(function () {
      finished = true;
      document.getElementById('status').textContent = 'GASの応答がありません。次回再確認します。';
      reject(new Error('GAS timeout'));
    }, 20000);
    google.script.run.withSuccessHandler(function (data) {
      if (finished) return;
      clearTimeout(timer);
      document.getElementById('status').textContent =
        'GAS取得成功：未対応 ' + data.count + ' 件（' + new Date().toLocaleTimeString() + '）';
      resolve(data);
    }).withFailureHandler(function () {
      if (finished) return;
      clearTimeout(timer);
      document.getElementById('status').textContent = '取得失敗。ログイン状態と職員権限を確認してください。';
      reject(new Error('GAS access failed'));
    }).getDeviceRelaySummary();
  });
};
</script></body></html>
