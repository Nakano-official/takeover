<!--
  ヘルプの入れ物と操作（D51）

  各画面が読み込むのではなく、code.js の renderHelp_ が chrome の末尾に付ける。
  全画面に付くので（話題の無い noHelp の画面を除く）、各画面の HTML を触る必要はない。

  ■ 流れ
    ヘッダーの「？ ヘルプ」→ 最前面にシートが開く。
      話題が1つ … すぐその話題を開く
      2つ以上   … 話題の一覧を出し、選んだものを開く
    話題は getHelp(key) で取り寄せ、section.help-step を1枚ずつ「次へ」でめくって見せる。
    見出しの下に、その話題の**ページの題名（data-title）を並べたナビ**を出す。何についての説明かが
    一目で分かり、押せばそのページへ飛べる（順にめくらなくてよい）。

  ■ 画面遷移を重くしないために
    話題の中身（画像を base64 で持つ）は**押したときに初めて取り寄せる**。取り寄せた中身は
    sessionStorage に持つので、同じタブで2回目以降はすぐ開く（D49 と同じ考え方）。
    タブを閉じれば消える。中身は説明文と画像だけで、個人の情報は入っていない。

  ■ スマホでの大きさ
    シートの高さは一定（画面の85%）。中身の量でシートの高さが跳ねると読みにくいという声があったため。
    上辺のつまみか見出しを上下に引くと高さを変えられ、変えた高さは同じタブの間は覚えておく。
    下まで引き下ろすと閉じる。PC では中央に出すので、この操作は無い。

  ■ 話題の中身の書き方は src/help-shift.html の冒頭を参照。
-->
<div id="helpModal" class="help-modal" hidden>
  <div class="help-sheet" id="helpSheet" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <div class="help-grab" id="helpGrab" aria-hidden="true"></div>
    <div class="help-head" id="helpHead">
      <button type="button" class="help-back" id="helpBack" hidden onclick="helpShowMenu()">‹ 一覧</button>
      <h2 id="helpTitle">ヘルプ</h2>
      <button type="button" class="help-x" onclick="closeHelp()" aria-label="閉じる">×</button>
    </div>
    <nav class="help-nav" id="helpNav" hidden aria-label="この話題のページ"></nav>
    <div class="help-body" id="helpBody"></div>
    <div class="help-foot" id="helpFoot" hidden>
      <button type="button" class="btn sm" id="helpPrev" onclick="helpGo(-1)">◀ 前へ</button>
      <span class="help-dots" id="helpDots"></span>
      <button type="button" class="btn sm primary" id="helpNext" onclick="helpGo(1)">次へ ▶</button>
    </div>
  </div>
</div>
<script>
  var HELP_CACHE_PREFIX = 'help:v1:';
  var HELP_STATE = { topic: null, steps: [], index: 0 };

  function openHelp() {
    var modal = document.getElementById('helpModal');
    modal.hidden = false;
    helpApplyHeight_();
    document.body.classList.add('help-open');
    var topics = window.HELP_TOPICS_HERE || [];
    if (topics.length === 1) helpOpenTopic(topics[0].key);
    else helpShowMenu();
  }

  // 画面の中のボタンから、話題を直接開く（「詳細はこちら」・D54）
  function openHelpTopic(key) {
    document.getElementById('helpModal').hidden = false;
    helpApplyHeight_();
    document.body.classList.add('help-open');
    helpOpenTopic(key);
  }

  function closeHelp() {
    document.getElementById('helpModal').hidden = true;
    document.body.classList.remove('help-open');
  }

  // 話題の一覧（その画面に話題が2つ以上あるとき）
  function helpShowMenu() {
    HELP_STATE.topic = null;
    document.getElementById('helpTitle').textContent = 'ヘルプ';
    document.getElementById('helpBack').hidden = true;
    document.getElementById('helpFoot').hidden = true;
    document.getElementById('helpNav').hidden = true;
    var topics = window.HELP_TOPICS_HERE || [];
    document.getElementById('helpBody').innerHTML =
      '<p class="help-lead">知りたいことを選んでください。</p>' +
      '<div class="help-menu">' + topics.map(function (t) {
        return '<button type="button" class="help-topic" onclick="helpOpenTopic(\'' +
          helpEsc_(t.key) + '\')">' + helpEsc_(t.title) + '<span aria-hidden="true">›</span></button>';
      }).join('') + '</div>';
  }

  function helpOpenTopic(key) {
    var topics = window.HELP_TOPICS_HERE || [];
    var t = topics.filter(function (x) { return x.key === key; })[0];
    document.getElementById('helpTitle').textContent = t ? t.title : 'ヘルプ';
    document.getElementById('helpBack').hidden = topics.length <= 1;
    document.getElementById('helpFoot').hidden = true;
    document.getElementById('helpNav').hidden = true;

    var cached = helpCacheRead_(key);
    if (cached) { helpStart_(key, cached); return; }

    var body = document.getElementById('helpBody');
    body.innerHTML = '<p class="state">読み込み中…</p>';
    google.script.run
      .withSuccessHandler(function (res) {
        helpCacheWrite_(key, res.html);
        if (HELP_STATE.pending === key) helpStart_(key, res.html);
      })
      .withFailureHandler(function (err) {
        if (HELP_STATE.pending === key) {
          body.innerHTML = '<div class="notice err">ヘルプを読み込めませんでした（' +
            helpEsc_(err && err.message ? err.message : String(err)) + '）。</div>';
        }
      })
      .getHelp(key);
    HELP_STATE.pending = key;   // 読み込み中に別の話題へ移ったら、遅れて届いた方は捨てる
  }

  function helpStart_(key, html) {
    HELP_STATE.pending = null;
    var box = document.createElement('div');
    box.innerHTML = html;
    HELP_STATE.topic = key;
    HELP_STATE.steps = Array.prototype.slice.call(box.querySelectorAll('section.help-step'));
    HELP_STATE.index = 0;
    helpRender_();
  }

  function helpGo(delta) {
    var next = HELP_STATE.index + delta;
    if (next >= HELP_STATE.steps.length) {
      // 最後のページの「次へ」は、話題が複数なら一覧へ、1つなら閉じる
      if ((window.HELP_TOPICS_HERE || []).length > 1) helpShowMenu(); else closeHelp();
      return;
    }
    if (next < 0) return;
    HELP_STATE.index = next;
    helpRender_();
  }

  // ナビの題名を押したとき
  function helpJump(k) {
    if (k < 0 || k >= HELP_STATE.steps.length) return;
    HELP_STATE.index = k;
    helpRender_();
  }

  function helpRender_() {
    var steps = HELP_STATE.steps;
    var body = document.getElementById('helpBody');
    var foot = document.getElementById('helpFoot');
    if (!steps.length) {
      body.innerHTML = '<p class="state">この話題の説明はまだありません。</p>';
      foot.hidden = true;
      return;
    }
    var i = HELP_STATE.index;
    var step = steps[i];

    // ページの題名を並べる（1ページだけの話題には出さない）
    var nav = document.getElementById('helpNav');
    nav.hidden = steps.length <= 1;
    nav.innerHTML = steps.map(function (s, k) {
      return '<button type="button"' + (k === i ? ' class="on" aria-current="step"' : '') +
        ' onclick="helpJump(' + k + ')"><span class="no">' + (k + 1) + '</span>' +
        helpEsc_(s.getAttribute('data-title') || '') + '</button>';
    }).join('');
    var on = nav.querySelector('button.on');
    // スマホでは横にスクロールする1列なので、今のページの題名が見える位置まで送る
    if (on && nav.scrollWidth > nav.clientWidth) {
      nav.scrollLeft = on.offsetLeft - (nav.clientWidth - on.offsetWidth) / 2;
    }

    body.innerHTML = '<h3 class="help-step-title">' + helpEsc_(step.getAttribute('data-title') || '') +
      '</h3>' + step.innerHTML;
    body.scrollTop = 0;
    foot.hidden = steps.length <= 1 && (window.HELP_TOPICS_HERE || []).length <= 1;
    document.getElementById('helpPrev').disabled = i === 0;
    var last = i === steps.length - 1;
    document.getElementById('helpNext').textContent = !last ? '次へ ▶'
      : ((window.HELP_TOPICS_HERE || []).length > 1 ? '一覧へ' : '閉じる');
    document.getElementById('helpDots').textContent = steps.length > 1 ? (i + 1) + ' / ' + steps.length : '';
  }

  function helpCacheRead_(key) {
    try { return window.sessionStorage.getItem(HELP_CACHE_PREFIX + key); } catch (e) { return null; }
  }
  function helpCacheWrite_(key, html) {
    try { window.sessionStorage.setItem(HELP_CACHE_PREFIX + key, html); } catch (e) { /* 持たないだけ */ }
  }

  function helpEsc_(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // ===== スマホ：上辺を引いて高さを変える =====
  var HELP_HEIGHT_KEY = 'help:height';
  var HELP_MIN_RATIO = 0.35;     // これより低くはしない（見出しとナビで埋まってしまう）
  var HELP_MAX_RATIO = 0.95;     // 上に少し背景を残す（押せば閉じられることが分かるように）
  var HELP_CLOSE_RATIO = 0.25;   // ここより下まで引き下ろしたら閉じる

  function helpIsSheet_() { return window.matchMedia('(max-width: 760px)').matches; }

  // 覚えている高さを当てる（画面の高さに対する割合で持つ。向きを変えても収まるように）
  function helpApplyHeight_() {
    var sheet = document.getElementById('helpSheet');
    if (!helpIsSheet_()) { sheet.style.height = ''; return; }
    var r = null;
    try { r = parseFloat(window.sessionStorage.getItem(HELP_HEIGHT_KEY)); } catch (e) { r = null; }
    sheet.style.height = (r && r >= HELP_MIN_RATIO && r <= HELP_MAX_RATIO)
      ? Math.round(window.innerHeight * r) + 'px' : '';
  }

  (function helpDrag_() {
    var sheet = document.getElementById('helpSheet');
    var drag = null;
    function start(e) {
      if (!helpIsSheet_()) return;
      if (e.button !== undefined && e.button !== 0) return;
      if (e.target.closest && e.target.closest('button')) return;   // ×・一覧のボタンは普通に押せるように
      drag = { y: e.clientY, h: sheet.getBoundingClientRect().height, moved: false, id: e.pointerId };
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* 取れなくても動く */ }
    }
    function move(e) {
      if (!drag || e.pointerId !== drag.id) return;
      var dy = e.clientY - drag.y;
      if (!drag.moved && Math.abs(dy) < 6) return;   // 少し触れただけでは動かさない
      drag.moved = true;
      sheet.classList.add('dragging');
      var vh = window.innerHeight;
      var h = Math.min(vh * HELP_MAX_RATIO, Math.max(vh * 0.1, drag.h - dy));
      sheet.style.height = Math.round(h) + 'px';
      e.preventDefault();
    }
    function end(e) {
      if (!drag || e.pointerId !== drag.id) return;
      var moved = drag.moved;
      drag = null;
      sheet.classList.remove('dragging');
      if (!moved) return;
      var vh = window.innerHeight;
      var ratio = sheet.getBoundingClientRect().height / vh;
      if (ratio < HELP_CLOSE_RATIO) { closeHelp(); helpApplyHeight_(); return; }
      ratio = Math.min(HELP_MAX_RATIO, Math.max(HELP_MIN_RATIO, ratio));
      sheet.style.height = Math.round(vh * ratio) + 'px';
      try { window.sessionStorage.setItem(HELP_HEIGHT_KEY, String(ratio)); } catch (err) { /* 覚えないだけ */ }
    }
    ['helpGrab', 'helpHead'].forEach(function (id) {
      var el = document.getElementById(id);
      el.addEventListener('pointerdown', start);
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
    });
    window.addEventListener('resize', function () {
      if (!document.getElementById('helpModal').hidden) helpApplyHeight_();
    });
  })();

  // 背景を押す・Esc で閉じる。左右キーでめくる
  document.getElementById('helpModal').addEventListener('click', function (e) {
    if (e.target.id === 'helpModal') closeHelp();
  });
  document.addEventListener('keydown', function (e) {
    if (document.getElementById('helpModal').hidden) return;
    if (e.key === 'Escape') closeHelp();
    else if (HELP_STATE.topic && e.key === 'ArrowRight') helpGo(1);
    else if (HELP_STATE.topic && e.key === 'ArrowLeft') helpGo(-1);
  });
</script>
