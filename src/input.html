<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include('shared-styles') ?>
  <style>
    :root { --main-max: 760px; }

    .qbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .qbar label { font-weight: 700; font-size: .9rem; margin: 0; }

    label { display: block; font-size: .85rem; font-weight: 700; margin: 0 0 6px; }
    /* 入力フォームは1列＝1項目。幅はここで揃える（共通CSSは幅を決めない） */
    input, select, textarea { width: 100%; }
    textarea { resize: vertical; min-height: 44px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
    .grid .full { grid-column: 1 / -1; }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

    .req { color: var(--danger); margin-left: 3px; }

    #submit { margin-top: 16px; }
    #cancelEdit { margin-top: 8px; }
    /* 一覧の行内ボタン（編集＝青の枠線／削除＝赤の枠線） */
    .btn.ed  { color: var(--brand-ink); border-color: var(--brand-border); }
    .btn.ed:hover:not(:disabled)  { background: var(--brand-soft); }
    .btn.del { color: var(--danger); border-color: var(--danger-border); }
    .btn.del:hover:not(:disabled) { background: var(--danger-bg); }

    .toast { margin-top: 12px; display: none; }
    .toast.ok, .toast.err { display: block; }

    .count { font-size: .82rem; color: var(--text-muted); margin-bottom: 10px; }
    .row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0;
           border-top: 1px solid var(--border); }
    .row:first-child { border-top: none; }
    .row .info { flex: 1; font-size: .88rem; line-height: 1.55; }
    .row .slot { font-weight: 700; color: var(--brand-ink); }
    .row .tag { display: inline-block; font-size: .7rem; padding: 0 7px;
                border-radius: var(--radius-pill); color: #fff; margin-left: 6px; vertical-align: 1px; }
    .row .tag.take { background: var(--brand); }
    .row .tag.help { background: #d98a00; }
    /* 単発コマ（D27）＝その日1回だけ。毎週のコマと一覧で見分けられるよう別色にする */
    .row .tag.once { background: var(--warn); }
    .row .sub { color: var(--text-muted); }
    .row .stf { color: var(--ok); }
    .ops { flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px; }
    /* 編集中の行は黄色く残して「いまどれを直しているか」を見失わないようにする */
    .row.editing { background: #fff8e6; border-radius: var(--radius-sm); }
  </style>
</head>
<body>
  <?!= chrome ?>

  <main>
    <div class="card">
      <div class="qbar">
        <label for="quarter">学期</label>
        <select id="quarter" style="max-width:280px" onchange="onQuarterChange()"></select>
        <span class="hint" style="margin:0">クォーター／セメスターを選んでこの学期のコマを編集します（新規も可）</span>
      </div>
    </div>

    <div class="card">
      <h2 id="formTitle">コマを追加</h2>
      <div id="form" class="state">読み込み中…</div>
      <div id="toast" class="toast"></div>
    </div>

    <div class="card">
      <h2>登録済みのコマ</h2>
      <div id="count" class="count"></div>
      <div id="list" class="state">—</div>
    </div>
  </main>

  <script>
    var DATA = null;
    var EDIT_ID = null;  // 編集中のコマID（null＝新規追加モード）

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function escapeAttr(s) {
      return escapeHtml(s).replace(/'/g, '&#39;').replace(/"/g, '&quot;');
    }
    function val(id) { return document.getElementById(id).value; }

    function load(quarter) {
      document.getElementById('form').className = 'state';
      document.getElementById('form').textContent = '読み込み中…';
      google.script.run
        .withSuccessHandler(onData)
        .withFailureHandler(function (err) {
          document.getElementById('form').textContent = 'エラー: ' + err.message;
        })
        .getInputData(quarter || null);
    }

    // 学期セレクタを DATA.terms（体系ラベル付き）で埋め、選択値を合わせる。
    function fillTermSelect() {
      var sel = document.getElementById('quarter');
      var terms = DATA.terms || [];
      if (!terms.length) {
        sel.innerHTML = '<option value="">（学期マスタ未設定）</option>';
        return;
      }
      sel.innerHTML = terms.map(function (t) {
        return '<option value="' + escapeHtml(t.value) + '">' + escapeHtml(t.label) + '</option>';
      }).join('');
      // 現在値（無ければ先頭）を選択
      var want = DATA.quarter || terms[0].value;
      sel.value = terms.some(function (t) { return t.value === want; }) ? want : terms[0].value;
    }

    function onData(data) {
      DATA = data;
      fillTermSelect();
      buildForm();
      renderList();
    }

    function onQuarterChange() {
      var q = val('quarter').trim();
      if (q) load(q);
    }

    function buildForm() {
      EDIT_ID = null;  // フォーム再構築時は新規追加モードに戻す
      var dayOpts = DATA.days.map(function (d) {
        return '<option value="' + escapeHtml(d) + '">' + escapeHtml(d) + '</option>';
      }).join('');
      // 時限の選択肢は内容（テイク/介助）が決まってから組む。移動介助の枠は
      // 介助でしか選べないため（D33）。組み直しは onTypeChange から呼ぶ。
      var perOpts = periodOptions('テイク');

      document.getElementById('form').className = '';
      document.getElementById('form').innerHTML =
        '<div class="grid">' +
          '<div class="full"><label>種別<span class="req">*</span></label>' +
            '<select id="recurrence" onchange="onRecurrenceChange()">' +
            '<option value="weekly">毎週（学期中くり返す授業）</option>' +
            '<option value="once">この日だけ（特別授業・説明会などのイベント）</option>' +
            '</select></div>' +
          '<div id="dayBox"><label>曜日<span class="req">*</span></label>' +
            '<select id="day" onchange="rebuildStaff()">' + dayOpts + '</select></div>' +
          '<div id="dateBox" style="display:none"><label>実施日<span class="req">*</span></label>' +
            '<input type="date" id="date" onchange="onDateChange()">' +
            '<div class="hint" id="dateDay" style="margin:4px 0 0"></div></div>' +
          '<div><label>時限<span class="req">*</span></label>' +
            '<select id="period" onchange="onPeriodChange()">' + perOpts + '</select>' +
            '<div class="hint" id="periodNote" style="margin:4px 0 0"></div></div>' +
          '<div><label>内容<span class="req">*</span></label>' +
            '<select id="support_type" onchange="onTypeChange()">' +
            '<option value="テイク">テイク（原則2名）</option>' +
            '<option value="介助">介助（1名）</option></select></div>' +
          '<div><label>利用者（被支援者）<span class="req">*</span></label>' +
            '<select id="user_sel" onchange="onUserSel()"></select>' +
            '<input id="user_new" style="display:none;margin-top:6px" placeholder="新しい利用者名"></div>' +
          '<div><label>科目名</label><input id="subject" placeholder="例：基礎数学"></div>' +
          '<div><label>担当教員</label><input id="instructor" placeholder="例：（仮）教員A"></div>' +
          '<div><label>教室</label><input id="room" placeholder="例：1-101"></div>' +
          '<div></div>' +
          '<div class="full" id="moveBox" style="display:none">' +
            '<label id="moveBeforeRow" style="font-weight:600;cursor:pointer;display:none">' +
            '<input type="checkbox" id="withMoveBefore" checked style="width:auto">' +
            '<span id="moveBeforeLabel"></span></label>' +
            '<label id="moveAfterRow" style="font-weight:600;cursor:pointer;display:none">' +
            '<input type="checkbox" id="withMoveAfter" checked style="width:auto">' +
            '<span id="moveAfterLabel"></span></label>' +
            '<div class="hint" id="moveHint" style="margin:4px 0 0"></div></div>' +
          '<div class="full"><label style="font-weight:600;cursor:pointer">' +
            '<input type="checkbox" id="eligOnly" checked onchange="rebuildStaff()" style="width:auto">' +
            ' このコマに空きがあり、スキルも合う人だけ表示</label>' +
            '<div class="hint" id="eligNote" style="margin:4px 0 0;display:none"></div></div>' +
          '<div><label>担当スタッフA<span class="req">*</span></label>' +
            '<select id="staff_a_id"></select></div>' +
          '<div><label>担当スタッフB</label><select id="staff_b_id"></select></div>' +
          '<div class="full"><label>備考</label><textarea id="note" placeholder="任意"></textarea></div>' +
        '</div>' +
        '<button class="btn primary block" id="submit" onclick="submitCourse()">このコマを追加</button>' +
        '<button class="btn block" id="cancelEdit" onclick="cancelEdit()" style="display:none">編集をやめる</button>' +
        '<p class="hint">＊は必須。テイクはB欄に2人目を選びます（未定なら「なし」のままでも登録可）。' +
        '毎週のコマでは、担当欄に「選んだ曜日・時限に空きがあり内容に対応できる人」だけを表示します。' +
        '「この日だけ」（特別授業・説明会など）では<b>全員から選べます</b>' +
        '（空きコマは毎週の予定なので、その日の予定を表さないため）。' +
        '登録済みのコマは下の一覧の「編集」から修正できます（教室が後から決まった場合など）。</p>';

      fillUserOptions();
      rebuildStaff();
    }

    // 利用者プルダウン（既存名＋「新規追加」）
    function fillUserOptions() {
      var sel = document.getElementById('user_sel');
      if (!sel) return;
      var opts = '<option value="">（選択してください）</option>' +
        DATA.users.map(function (u) {
          return '<option value="' + escapeHtml(u) + '">' + escapeHtml(u) + '</option>';
        }).join('') +
        '<option value="__new__">＋ 新しい利用者を追加…</option>';
      sel.innerHTML = opts;
    }

    function onUserSel() {
      var box = document.getElementById('user_new');
      if (val('user_sel') === '__new__') { box.style.display = ''; box.focus(); }
      else { box.style.display = 'none'; }
    }

    // 入力された利用者名（既存選択 or 新規入力）
    function userValue() {
      return val('user_sel') === '__new__'
        ? document.getElementById('user_new').value.trim()
        : val('user_sel');
    }

    // 介助のときはB欄を無効化（1名）。内容が変わると候補も組み直す。
    function onTypeChange() {
      rebuildStaff();
      var b = document.getElementById('staff_b_id');
      rebuildPeriods();
      onPeriodChange();
      if (val('support_type') === '介助') { b.value = ''; b.disabled = true; }
      else { b.disabled = false; }
    }

    // ===== 種別（毎週 / この日だけ）=====
    function isOnce() {
      var el = document.getElementById('recurrence');
      return !!el && el.value === 'once';
    }

    // 'yyyy-MM-dd' を一覧向けの日本語表記にする（例：9/12（土））。
    // 年は学期の中では冗長なので落とし、週バー（home）の日付ラベルと同じ M/D に揃える。
    // サーバーが必ず 'yyyy-MM-dd' に正規化して返す前提（courseDate_ が Date も吸収する）。
    function dateLabel(iso) {
      var m = String(iso || '').split('-');
      if (m.length !== 3) return String(iso || '');   // 想定外の値はそのまま出す
      var w = weekdayOfISO(iso);
      return (+m[1]) + '/' + (+m[2]) + (w ? '（' + w + '）' : '');
    }

    function weekdayOfISO(iso) {
      var m = String(iso || '').split('-');
      if (m.length !== 3) return '';
      var d = new Date(+m[0], +m[1] - 1, +m[2]);
      if (isNaN(d.getTime())) return '';
      return ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
    }

    // 毎週＝曜日を選ぶ／この日だけ＝日付を選ぶ。曜日は日付から自動で決まる（サーバーも同じ導出）。
    function onRecurrenceChange() {
      var once = isOnce();
      document.getElementById('dayBox').style.display = once ? 'none' : '';
      document.getElementById('dateBox').style.display = once ? '' : 'none';

      // 単発コマでは「空き×スキル」の絞り込みを使わない。available_slots は
      // 毎週の空きコマであって、その日に空いているかを表さないため（全員から選ぶ）。
      var elig = document.getElementById('eligOnly');
      var note = document.getElementById('eligNote');
      elig.disabled = once;
      note.style.display = once ? '' : 'none';
      note.textContent = once
        ? '「この日だけ」では絞り込みは使いません（空きコマは毎週の予定で、その日の空き状況を表さないため）。全員から選べます。'
        : '';
      onDateChange();
      onPeriodChange();
    }

    function onDateChange() {
      var lab = document.getElementById('dateDay');
      if (isOnce()) {
        var w = weekdayOfISO(val('date'));
        lab.textContent = w ? w + '曜日として登録されます' : '実施日を選んでください';
      }
      rebuildStaff();
    }

    /**
     * その内容で選べる時限だけの <option>（D33）。
     * ここを絞らないとテイクを移動介助の枠に登録でき、そのコマは
     * **代行候補が永久に0人**になる（テイクの空きコマ表に移動枠は無いため）。
     * サーバー側（validateCoursePayload_）でも同じ検証をしている。
     */
    function periodOptions(type) {
      return DATA.periods.filter(function (p) {
        return (p.supportTypes || []).indexOf(type) !== -1;
      }).map(function (p) {
        return '<option value="' + escapeAttr(p.period) + '">'
          + escapeHtml(p.label || (p.period + '限'))
          + (p.time ? '（' + escapeHtml(p.time) + '）' : '') + '</option>';
      }).join('');
    }

    /**
     * 選んでいる授業にくっついた移動枠があれば、「一緒に登録」を出す（D34・D35）。
     *
     * 介助は「その授業の担当が、その授業の前後の移動も担当する」のが基本形なので
     * **既定でオン**にする。移動が要らないときだけ外してもらう。
     *
     * 前と後は別の枠。2限のあと（食堂へ運ぶ）と3限の前は、同じ昼休みの中に並ぶが
     * 担当する人が違う（D35）。だから片方だけ出ることもある。
     * 移動枠そのものを選んでいるときは出さない（移動の前の移動、になってしまう）。
     */
    function onPeriodChange() {
      var box = document.getElementById('moveBox');
      if (box) {
        var per = currentPeriod();
        // 移動枠を選んでいるとき（supportTypes が1つに限定された枠）は対象外
        var isMoveItself = per && (per.supportTypes || []).length < 2;
        var eligible = per && !isMoveItself && val('support_type') === '介助' && !isOnce();

        var before = eligible ? per.moveBefore : null;
        var after = eligible ? per.moveAfter : null;
        setMoveRow('Before', before, 'この授業の前の');
        setMoveRow('After', after, 'この授業のあとの');

        if (before || after) {
          box.style.display = '';
          document.getElementById('moveHint').textContent =
            '同じ担当・同じ利用者で、教室はこの授業の教室を引き継ぎます。'
            + '移動が不要ならチェックを外してください。';
        } else {
          box.style.display = 'none';
        }
      }
      rebuildStaff();
    }

    // 前／後それぞれの行を出し入れする
    function setMoveRow(side, mv, prefix) {
      var row = document.getElementById('move' + side + 'Row');
      if (!row) return;
      if (!mv) { row.style.display = 'none'; return; }
      row.style.display = '';
      document.getElementById('move' + side + 'Label').textContent =
        '　' + prefix + mv.label + 'も一緒に登録する（' + mv.time + '）';
    }

    // いま選んでいる時限（サーバーから来た定義）
    function currentPeriod() {
      var key = val('period');
      return (DATA.periods || []).filter(function (p) { return p.period === key; })[0] || null;
    }

    // 内容を変えたら時限の選択肢を組み直す（選択中の時限は選べるなら維持する）
    function rebuildPeriods() {
      var sel = document.getElementById('period');
      if (!sel) return;
      var keep = sel.value;
      var type = val('support_type');
      sel.innerHTML = periodOptions(type);
      if (keep) sel.value = keep;
      if (!sel.value && sel.options.length) sel.selectedIndex = 0;

      var note = document.getElementById('periodNote');
      if (note) {
        var limited = DATA.periods.filter(function (p) {
          return (p.supportTypes || []).indexOf(type) !== -1 &&
            (p.supportTypes || []).length < 2;
        });
        note.textContent = limited.length
          ? '「' + limited[0].label + '」は授業のあいだの枠です（' + type + 'のみ）。'
          : '';
      }
    }

    // 担当A/Bの候補を「空き＋スキル」で組み直す（選択中の値は可能なら維持）
    function staffEligible(s) {
      var slotKey = val('day') + val('period');
      var type = val('support_type');
      var skillOk = !s.skills ||
        s.skills.split(',').map(function (x) { return x.trim(); }).indexOf(type) !== -1;
      // 空きコマは業務ごとに別（D32）。選んでいる内容の空きコマだけを見る。
      var slots = (s.slotsByType && s.slotsByType[type]) || [];
      return skillOk && slots.indexOf(slotKey) !== -1;
    }

    function rebuildStaff() {
      // 単発コマは常に全員から選ぶ（絞り込みの条件そのものが成り立たない）
      var eligOnly = !isOnce() && document.getElementById('eligOnly').checked;
      var list = eligOnly ? DATA.staff.filter(staffEligible) : DATA.staff.slice();
      var opt = function (s) {
        var label = s.name + (s.skills ? '（' + s.skills + '）' : '');
        return '<option value="' + escapeHtml(s.staff_id) + '">' + escapeHtml(label) + '</option>';
      };
      var body = list.map(opt).join('');

      var a = document.getElementById('staff_a_id');
      var b = document.getElementById('staff_b_id');
      var prevA = a.value, prevB = b.value;
      a.innerHTML = body ||
        '<option value="">該当者なし（絞り込みを外してください）</option>';
      b.innerHTML = '<option value="">（なし・1名）</option>' + body;
      // 直前の選択が候補に残っていれば維持
      if (list.some(function (s) { return s.staff_id === prevA; })) a.value = prevA;
      if (prevB && list.some(function (s) { return s.staff_id === prevB; })) b.value = prevB;
    }

    // 追加 or 更新（EDIT_ID の有無で分岐）
    function submitCourse() {
      var once = isOnce();
      var payload = {
        quarter: val('quarter').trim(),
        // 単発コマは曜日を送らない（サーバーが実施日から導出する・D27）
        day: once ? '' : val('day'),
        date: once ? val('date') : '',
        period: val('period'),
        support_type: val('support_type'),
        user_student: userValue(),
        subject: val('subject').trim(),
        instructor: val('instructor').trim(),
        room: val('room').trim(),
        staff_a_id: val('staff_a_id'),
        staff_b_id: document.getElementById('staff_b_id').disabled ? '' : val('staff_b_id'),
        note: val('note').trim(),
        // 授業の前／後の移動介助も一緒に作るか（D34・D35）。
        // その行が画面に出ていないときは送らない（枠が無い＝作りようがない）
        withMoveBefore: moveChecked('Before'),
        withMoveAfter: moveChecked('After'),
      };
      if (!payload.quarter) { showToast('学期を選択してください。', false); return; }
      if (once && !payload.date) { showToast('実施日を選んでください。', false); return; }
      if (!payload.user_student) { showToast('利用者を入力してください。', false); return; }

      if (EDIT_ID) { runUpdate(payload); } else { runAdd(payload); }
    }

    // チェックが画面に出ていて、かつオンか
    function moveChecked(side) {
      var box = document.getElementById('moveBox');
      var row = document.getElementById('move' + side + 'Row');
      if (!box || box.style.display === 'none') return false;
      if (!row || row.style.display === 'none') return false;
      return document.getElementById('withMove' + side).checked;
    }

    function runAdd(payload) {
      var btn = document.getElementById('submit');
      btn.disabled = true; btn.textContent = '追加中…';
      google.script.run
        .withSuccessHandler(function (res) {
          showToast('追加しました（' + res.course_id +
            ((res.move_course_ids || []).length
              ? ' ／ 移動介助 ' + res.move_course_ids.join('・') : '') + '）。', true);
          // 入力しやすいよう、コマ固有の項目だけクリア（曜日・時限・内容・担当は維持）
          ['subject', 'instructor', 'room', 'note', 'user_new'].forEach(function (id) {
            document.getElementById(id).value = '';
          });
          document.getElementById('user_new').style.display = 'none';
          btn.disabled = false; btn.textContent = 'このコマを追加';
          refreshList(payload.quarter); // フォームは保ったまま一覧だけ更新
        })
        .withFailureHandler(function (err) {
          showToast(err.message, false);
          btn.disabled = false; btn.textContent = 'このコマを追加';
        })
        .addCourse(payload);
    }

    function runUpdate(payload) {
      payload.course_id = EDIT_ID;
      var btn = document.getElementById('submit');
      btn.disabled = true; btn.textContent = '更新中…';
      google.script.run
        .withSuccessHandler(function (res) {
          showToast('更新しました（' + res.course_id + '）。', true);
          load(payload.quarter); // フォームごと再構築 → 新規追加モードに戻る
        })
        .withFailureHandler(function (err) {
          showToast(err.message, false);
          btn.disabled = false; btn.textContent = 'このコマを更新';
        })
        .updateCourse(payload);
    }

    // 一覧の「編集」→ 上のフォームに値を流し込み、更新モードに切り替える
    function editCourse(id) {
      var c = null;
      for (var i = 0; i < DATA.courses.length; i++) {
        if (DATA.courses[i].course_id === id) { c = DATA.courses[i]; break; }
      }
      if (!c) { showToast('対象のコマが見つかりません。一覧を更新してください。', false); return; }

      EDIT_ID = id;
      // 担当に現在の人が必ず出るよう、まず絞り込みを外して全員表示にする
      document.getElementById('eligOnly').checked = false;
      document.getElementById('recurrence').value = c.date ? 'once' : 'weekly';
      document.getElementById('date').value = c.date || '';
      onRecurrenceChange();          // 表示の出し分け（この中で rebuildStaff も走る）
      document.getElementById('day').value = c.day;
      document.getElementById('period').value = c.period;
      document.getElementById('support_type').value = c.support_type;
      onTypeChange(); // 候補を組み直し（介助ならB無効化）

      // 利用者（既存名なら選択、無ければ新規入力欄へ）
      var sel = document.getElementById('user_sel');
      var inList = false;
      for (var j = 0; j < sel.options.length; j++) {
        if (sel.options[j].value === c.user_student) { inList = true; break; }
      }
      if (inList) {
        sel.value = c.user_student;
        document.getElementById('user_new').style.display = 'none';
      } else {
        sel.value = '__new__';
        onUserSel();
        document.getElementById('user_new').value = c.user_student;
      }

      document.getElementById('subject').value = c.subject || '';
      document.getElementById('instructor').value = c.instructor || '';
      document.getElementById('room').value = c.room || '';
      document.getElementById('note').value = c.note || '';
      document.getElementById('staff_a_id').value = c.staff_a_id || '';
      var b = document.getElementById('staff_b_id');
      if (!b.disabled) b.value = c.staff_b_id || '';

      document.getElementById('formTitle').textContent = 'コマを編集（' + id + '）';
      var btn = document.getElementById('submit');
      btn.disabled = false; btn.textContent = 'このコマを更新';
      document.getElementById('cancelEdit').style.display = '';
      renderList(); // 編集中の行をハイライト
      document.getElementById('formTitle').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // 編集をやめて新規追加モードへ戻す
    function cancelEdit() {
      EDIT_ID = null;
      document.getElementById('formTitle').textContent = 'コマを追加';
      var btn = document.getElementById('submit');
      btn.disabled = false; btn.textContent = 'このコマを追加';
      document.getElementById('cancelEdit').style.display = 'none';
      document.getElementById('eligOnly').checked = true;
      document.getElementById('recurrence').value = 'weekly';
      document.getElementById('date').value = '';
      onRecurrenceChange();
      ['subject', 'instructor', 'room', 'note', 'user_new'].forEach(function (id) {
        document.getElementById(id).value = '';
      });
      document.getElementById('user_new').style.display = 'none';
      document.getElementById('user_sel').value = '';
      rebuildStaff();
      renderList();
    }

    // フォームを再構築せず、一覧と候補リストだけ更新する
    function refreshList(quarter) {
      google.script.run
        .withSuccessHandler(function (data) {
          DATA = data;
          fillTermSelect();
          // 新しい利用者が増えている場合に備えてプルダウンを更新（選択はリセット）
          fillUserOptions();
          rebuildStaff();
          renderList();
        })
        .withFailureHandler(function (err) { showToast(err.message, false); })
        .getInputData(quarter || null);
    }

    function delCourse(id, label) {
      if (!confirm(label + '\nこのコマを削除しますか？')) return;
      google.script.run
        .withSuccessHandler(function () {
          showToast('削除しました。', true);
          load(val('quarter').trim());
        })
        .withFailureHandler(function (err) { showToast(err.message, false); })
        .deleteCourse(id);
    }

    function renderList() {
      var host = document.getElementById('list');
      var countEl = document.getElementById('count');
      var courses = DATA.courses;
      countEl.textContent = 'この学期のコマ: ' + courses.length + ' 件';
      if (courses.length === 0) {
        host.className = 'state';
        host.textContent = 'まだコマがありません。上のフォームから追加してください。';
        return;
      }
      host.className = '';
      host.innerHTML = courses.map(function (c) {
        var isTake = c.support_type === 'テイク';
        var staff = escapeHtml(c.staffA || '—') + (c.staffB ? ' ・ ' + escapeHtml(c.staffB) : '');
        // 単発コマは曜日ではなく実施日で示す（毎週のコマと読み分けられるように）
        var slot = c.date
          ? escapeHtml(dateLabel(c.date)) + escapeHtml(c.periodLabel || (c.period + '限'))
          : escapeHtml(c.day) + escapeHtml(c.periodLabel || (c.period + '限'));
        var label = slot + ' ' + c.support_type + ' ' + (c.user_student || '');
        var info =
          '<span class="slot">' + slot + '</span>' +
          '<span class="tag ' + (isTake ? 'take' : 'help') + '">' + escapeHtml(c.support_type) + '</span>' +
          (c.date ? '<span class="tag once">単発</span>' : '') +
          ' <b>' + escapeHtml(c.user_student) + '</b>' +
          '<div class="sub">' + escapeHtml(c.subject || '—')
            + (c.room ? ' / ' + escapeHtml(c.room) : '')
            + (c.instructor ? ' / ' + escapeHtml(c.instructor) : '') + '</div>' +
          '<div class="stf">担当: ' + staff + '</div>' +
          (c.note ? '<div class="sub">備考: ' + escapeHtml(c.note) + '</div>' : '');
        var cid = escapeHtml(c.course_id);
        var editing = (c.course_id === EDIT_ID) ? ' editing' : '';
        return '<div class="row' + editing + '"><div class="info">' + info + '</div>' +
          '<div class="ops">' +
            '<button class="btn sm ed" onclick="editCourse(\'' + cid + '\')">編集</button>' +
            '<button class="btn sm del" onclick="delCourse(\'' + cid + '\',\''
              + escapeHtml(label).replace(/'/g, '') + '\')">削除</button>' +
          '</div></div>';
      }).join('');
    }

    function showToast(msg, ok) {
      var t = document.getElementById('toast');
      t.className = 'notice toast ' + (ok ? 'ok' : 'err');
      t.textContent = msg;
    }

    load(null);
  </script>
</body>
</html>
