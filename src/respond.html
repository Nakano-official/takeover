<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include('shared-styles') ?>
  <style>
    :root { --main-max: 520px; }

    .detail { font-size: .95rem; line-height: 1.9; margin: 0; }
    .detail dt { color: var(--text-muted); font-size: .78rem; }
    .detail dd { margin: 0 0 12px; font-weight: 700; }
    /* 承諾／辞退は指で押す前提なので大きめ・等幅に並べる */
    .btns { display: flex; gap: 12px; margin-top: 22px; }
    .btns .btn { flex: 1; padding: 15px; font-size: 1.05rem; font-weight: 700; }
    .decline { background: #6d7684; border-color: #6d7684; color: #fff; }
    .decline:hover:not(:disabled) { background: #5b636f; border-color: #5b636f; }
    .msg { margin-top: 16px; text-align: center; }
    .current { font-size: .85rem; color: var(--text-muted); margin-top: 12px; text-align: center; }
  </style>
</head>
<body>
  <?!= chrome ?>

  <main>
    <div class="card">
      <div id="content" class="state">読み込み中…</div>
    </div>
  </main>

  <script>
    var VACANCY_ID = '<?= params.vacancy || "" ?>';

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // 日付がDate型でも文字列でも YYYY-MM-DD に整形する
    function fmtDate(d) {
      if (!d) return '';
      if (d instanceof Date) {
        return d.getFullYear() + '-' +
          ('0' + (d.getMonth() + 1)).slice(-2) + '-' +
          ('0' + d.getDate()).slice(-2);
      }
      return String(d).slice(0, 10);
    }

    function render(v) {
      var content = document.getElementById('content');

      // サーバーが空を返した場合（デプロイ版が古い等）に固まらないようにする
      if (!v) {
        content.className = 'state';
        content.textContent =
          'データを取得できませんでした。デプロイが最新バージョンか確認してください。';
        return;
      }

      var detail =
        '<dl class="detail">' +
        '<dt>日付</dt><dd>' + escapeHtml(fmtDate(v.date)) + '</dd>' +
        '<dt>コマ</dt><dd>' + escapeHtml(v.day + v.period) + '限' +
          (v.time ? '（' + escapeHtml(v.time) + '）' : '') + '</dd>' +
        '<dt>欠勤するスタッフ</dt><dd>' + escapeHtml(v.absentName) + '</dd>' +
        '</dl>';

      // 対応確定済み
      if (v.closed) {
        content.className = '';
        content.innerHTML = detail +
          '<div class="notice msg info">この欠員は既に対応が確定しています。回答は受け付けていません。</div>';
        return;
      }
      // 候補ではない
      if (!v.eligible) {
        content.className = '';
        content.innerHTML = detail +
          '<div class="notice msg warn">あなたはこの時限の代行候補ではないため、回答できません。</div>';
        return;
      }

      var current = v.myAnswer
        ? '<div class="current">現在の回答: <b>' + escapeHtml(v.myAnswer) + '</b>（変更できます）</div>'
        : '';

      content.className = '';
      content.innerHTML = detail +
        '<div class="btns">' +
        '<button class="btn ok" onclick="answer(\'承諾\')">承諾する</button>' +
        '<button class="btn decline" onclick="answer(\'辞退\')">辞退する</button>' +
        '</div>' + current +
        '<div id="msg"></div>';
    }

    function answer(ans) {
      var buttons = document.querySelectorAll('.btns button');
      buttons.forEach(function (b) { b.disabled = true; });
      document.getElementById('msg').innerHTML =
        '<div class="notice msg info">送信中…</div>';

      google.script.run
        .withSuccessHandler(function (res) {
          var msg = document.getElementById('msg');
          res = res || {};

          // 先約で埋まった → 受付終了。ボタンは無効のままにする。
          if (res.filled) {
            msg.innerHTML =
              '<div class="notice msg info">この欠員は既に他の方で補充が決まりました。<br>' +
              '回答は締め切られています。</div>';
            return;
          }
          // 承諾が通って自分に確定した
          if (res.confirmed) {
            msg.innerHTML =
              '<div class="notice msg ok">あなたに代行が決まりました！<br>' +
              'ご協力ありがとうございます。</div>';
            return; // 確定済みなのでボタンは無効のまま
          }
          // 辞退を記録（欠員はまだ開いているので、気が変われば承諾できるよう再度有効化）
          buttons.forEach(function (b) { b.disabled = false; });
          msg.innerHTML =
            '<div class="notice msg info">辞退で承りました。ご確認ありがとうございます。</div>';
        })
        .withFailureHandler(function (err) {
          buttons.forEach(function (b) { b.disabled = false; });
          document.getElementById('msg').innerHTML =
            '<div class="notice msg warn">エラー: ' + escapeHtml(err.message) + '</div>';
        })
        .respondToVacancy(VACANCY_ID, ans);
    }

    function onError(err) {
      var content = document.getElementById('content');
      content.className = 'state';
      content.textContent = 'エラー: ' + err.message;
    }

    if (!VACANCY_ID) {
      var c = document.getElementById('content');
      c.className = 'state';
      c.textContent = '欠員が指定されていません。通知メッセージのリンクから開いてください。';
    } else {
      google.script.run.withSuccessHandler(render).withFailureHandler(onError)
        .getVacancyForRespond(VACANCY_ID);
    }
  </script>
</body>
</html>
