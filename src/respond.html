<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body { font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", sans-serif;
           margin: 0; background: #f5f6f8; color: #222; }
    header { background: #4a86e8; color: #fff; padding: 14px 16px; }
    header h1 { font-size: 1.1rem; margin: 0; }
    header .user { font-size: .8rem; opacity: .9; margin-top: 2px; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: #fff;
          border-bottom: 1px solid #e3e6ea; }
    nav a { font-size: .85rem; text-decoration: none; color: #4a86e8;
            border: 1px solid #cdddfb; border-radius: 999px; padding: 5px 12px; }
    nav a:hover { background: #eef4ff; }
    main { padding: 16px; max-width: 520px; margin: 0 auto; }
    .card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .detail { font-size: .95rem; line-height: 1.9; }
    .detail dt { color: #888; font-size: .8rem; }
    .detail dd { margin: 0 0 10px; font-weight: 600; }
    .btns { display: flex; gap: 12px; margin-top: 22px; }
    .btns button { flex: 1; padding: 14px; font-size: 1.05rem; font-weight: 700;
                   border: none; border-radius: 8px; cursor: pointer; color: #fff; }
    .accept { background: #1e7a3d; }
    .decline { background: #777; }
    .btns button:disabled { opacity: .5; cursor: default; }
    .state { padding: 22px; text-align: center; color: #888; }
    .msg { margin-top: 16px; padding: 16px; border-radius: 8px; font-size: .95rem;
           line-height: 1.7; text-align: center; }
    .msg.ok   { background: #e7f6ec; color: #1e7a3d; border: 1px solid #b7e4c4; }
    .msg.info { background: #eef6ff; color: #2a63c0; border: 1px solid #cfe2fb; }
    .msg.warn { background: #fff7e6; color: #9a6b00; border: 1px solid #ffe0a3; }
    .current { font-size: .85rem; color: #666; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>代行依頼への回答</h1>
    <div class="user"><?= user.name ?> さん（<?= user.role ?>）</div>
  </header>

  <nav>
    <a href="<?= appUrl ?>?page=home">シフト確認</a>
    <a href="<?= appUrl ?>?page=absence">欠勤連絡</a>
    <? if (user.role === '職員') { ?>
      <a href="<?= appUrl ?>?page=manage">欠員補充管理</a>
    <? } ?>
  </nav>

  <main>
    <div class="card">
      <div id="content" class="state">読み込み中…</div>
    </div>
  </main>

  <script>
    var VACANCY_ID = '<?= params.vacancy || "" ?>';

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // 日付がDate型でも文字列でも YYYY-MM-DD に整形する
    function fmtDate(d) {
      if (!d) return '';
      if (d instanceof Date) {
        return d.getFullYear() + '-' +
          ('0' + (d.getMonth() + 1)).slice(-2) + '-' +
          ('0' + d.getDate()).slice(-2);
      }
      return String(d).slice(0, 10);
    }

    function render(v) {
      var content = document.getElementById('content');

      // サーバーが空を返した場合（デプロイ版が古い等）に固まらないようにする
      if (!v) {
        content.className = 'state';
        content.textContent =
          'データを取得できませんでした。デプロイが最新バージョンか確認してください。';
        return;
      }

      var detail =
        '<dl class="detail">' +
        '<dt>日付</dt><dd>' + escapeHtml(fmtDate(v.date)) + '</dd>' +
        '<dt>コマ</dt><dd>' + escapeHtml(v.day + v.period) + '限' +
          (v.time ? '（' + escapeHtml(v.time) + '）' : '') + '</dd>' +
        '<dt>欠勤するスタッフ</dt><dd>' + escapeHtml(v.absentName) + '</dd>' +
        '</dl>';

      // 対応確定済み
      if (v.closed) {
        content.className = '';
        content.innerHTML = detail +
          '<div class="msg info">この欠員は既に対応が確定しています。回答は受け付けていません。</div>';
        return;
      }
      // 候補ではない
      if (!v.eligible) {
        content.className = '';
        content.innerHTML = detail +
          '<div class="msg warn">あなたはこの時限の代行候補ではないため、回答できません。</div>';
        return;
      }

      var current = v.myAnswer
        ? '<div class="current">現在の回答: <b>' + escapeHtml(v.myAnswer) + '</b>（変更できます）</div>'
        : '';

      content.className = '';
      content.innerHTML = detail +
        '<div class="btns">' +
        '<button class="accept" onclick="answer(\'承諾\')">承諾する</button>' +
        '<button class="decline" onclick="answer(\'辞退\')">辞退する</button>' +
        '</div>' + current +
        '<div id="msg"></div>';
    }

    function answer(ans) {
      var buttons = document.querySelectorAll('.btns button');
      buttons.forEach(function (b) { b.disabled = true; });
      document.getElementById('msg').innerHTML =
        '<div class="msg info">送信中…</div>';

      google.script.run
        .withSuccessHandler(function (res) {
          var msg = document.getElementById('msg');
          res = res || {};

          // 先約で埋まった → 受付終了。ボタンは無効のままにする。
          if (res.filled) {
            msg.innerHTML =
              '<div class="msg info">この欠員は既に他の方で補充が決まりました。<br>' +
              '回答は締め切られています。</div>';
            return;
          }
          // 承諾が通って自分に確定した
          if (res.confirmed) {
            msg.innerHTML =
              '<div class="msg ok">あなたに代行が決まりました！<br>' +
              'ご協力ありがとうございます。</div>';
            return; // 確定済みなのでボタンは無効のまま
          }
          // 辞退を記録（欠員はまだ開いているので、気が変われば承諾できるよう再度有効化）
          buttons.forEach(function (b) { b.disabled = false; });
          msg.innerHTML =
            '<div class="msg info">辞退で承りました。ご確認ありがとうございます。</div>';
        })
        .withFailureHandler(function (err) {
          buttons.forEach(function (b) { b.disabled = false; });
          document.getElementById('msg').innerHTML =
            '<div class="msg warn">エラー: ' + escapeHtml(err.message) + '</div>';
        })
        .respondToVacancy(VACANCY_ID, ans);
    }

    function onError(err) {
      var content = document.getElementById('content');
      content.className = 'state';
      content.textContent = 'エラー: ' + err.message;
    }

    if (!VACANCY_ID) {
      var c = document.getElementById('content');
      c.className = 'state';
      c.textContent = '欠員が指定されていません。通知メッセージのリンクから開いてください。';
    } else {
      google.script.run.withSuccessHandler(render).withFailureHandler(onError)
        .getVacancyForRespond(VACANCY_ID);
    }
  </script>
</body>
</html>
