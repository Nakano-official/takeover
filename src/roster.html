<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include('shared-styles') ?>
  <style>
    :root { --main-max: 1040px; }

    .card { padding: 16px 18px; margin-bottom: 14px; }

    /* 上段：学生スタッフの状態を数で出す。押すとその条件で絞り込む */
    .summary { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { border: 1px solid transparent; border-radius: var(--radius-pill);
            padding: 6px 14px; font-size: .85rem; font-weight: 700;
            cursor: pointer; font-family: inherit; }
    .chip.total { background: var(--brand-soft); color: var(--brand-ink); }
    .chip.ok    { background: var(--ok-bg);      color: var(--ok); }
    .chip.warn  { background: var(--warn-bg);    color: var(--warn); }
    .chip.zero  { background: var(--surface-alt); color: var(--text-faint); }
    .chip.on    { border-color: currentColor; box-shadow: var(--shadow-1); }

    /* 絞り込み */
    .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: .78rem; color: var(--text-muted); }
    .field input, .field select { font-size: .9rem; padding: 7px 10px; }
    #q { min-width: 220px; }
    .count { font-size: .82rem; color: var(--text-muted); margin: 10px 0 0; }

    /* ===== 入学年度ごとのまとまり（D61）===== */
    .ghead { display: flex; align-items: baseline; gap: 8px; margin: 18px 0 8px; padding-bottom: 4px;
             border-bottom: 2px solid var(--brand-border); }
    .ghead:first-child { margin-top: 0; }
    .ghead h3 { margin: 0; font-size: 1rem; color: var(--brand-ink); }
    .ghead .n { font-size: .8rem; color: var(--text-muted); }
    /* 1人1枚の箱を行列に並べる。幅に合わせて列の数が変わる */
    .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
    .pc { border: 1px solid var(--border); border-left: 4px solid var(--border-strong); border-radius: var(--radius);
          background: var(--surface); padding: 10px 12px; cursor: pointer; font-size: .82rem; line-height: 1.55;
          box-shadow: var(--shadow-1); }
    .pc:hover { background: var(--brand-soft); }
    /* 要対応は左端に色。並べ替えはしない（見るたびに箱が動かないように） */
    .pc.attn { border-left-color: var(--warn); }
    .pc.blocked { border-left-color: var(--danger); }
    .pc.ok { border-left-color: var(--ok); }
    /* 開いている人の箱は枠で示す。詳細はそのまとまりの下に出す（箱の並びは崩さない） */
    .pc.open { box-shadow: 0 0 0 2px var(--brand); background: var(--brand-soft); }
    .pc .top { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; }
    .pc .nm { font-weight: 700; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pc .sid { font-size: .72rem; color: var(--text-faint); white-space: nowrap; }
    .pc .role { margin-left: auto; }
    .pc .kv { display: grid; grid-template-columns: 64px 1fr; gap: 1px 8px; }
    .pc .kv span:nth-child(odd) { color: var(--text-muted); font-size: .74rem; }
    .pc .closebtn { float: right; }

    .who { font-weight: 700; }
    .who .id { display: block; font-weight: normal; font-size: .74rem; color: var(--text-faint); }
    .role { display: inline-block; padding: 1px 9px; border-radius: var(--radius-pill);
            font-size: .74rem; font-weight: 700; white-space: nowrap;
            background: var(--surface-alt); color: var(--text-muted); }
    .role.staff { background: var(--info-bg); color: var(--info); }

    .yes { color: var(--ok); font-weight: 700; }
    .no  { color: var(--danger); font-weight: 700; }
    .na  { color: var(--text-faint); }
    .stale { color: var(--warn); font-weight: 700; }

    /* 箱を押したときに出る詳細（そのまとまりの下） */
    .detail { margin-top: 10px; padding: 12px 14px; border: 1px solid var(--brand-border); border-radius: var(--radius);
              background: var(--surface-alt); }
    .detail .dhead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .detail .dhead b { font-size: 1rem; }
    .detail .dhead .btn { margin-left: auto; }
    .dl { display: grid; grid-template-columns: 92px 1fr; gap: 6px 14px; margin: 0 0 10px;
          font-size: .88rem; }
    .dl dt { color: var(--text-muted); font-size: .8rem; }
    .dl dt small { display: block; color: var(--text-faint); font-size: .95em; font-weight: normal; }
    .dl dd { margin: 0; word-break: break-all; }
    .dl dd.empty { color: var(--text-faint); }
    .slotlist { display: flex; flex-wrap: wrap; gap: 5px; }
    .slot { background: var(--surface); border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm); padding: 1px 8px; font-size: .8rem; }
    .todo { margin: 0; padding-left: 18px; font-size: .84rem; color: var(--warn); line-height: 1.7; }
    .todo li { margin-bottom: 2px; }
  </style>
</head>
<body>
  <?!= chrome ?>

  <main>
    <div id="top" class="state">読み込み中…</div>

    <div id="body" hidden>
      <div class="card">
        <h2>学生スタッフの状態</h2>
        <div id="summary" class="summary"></div>
        <p class="hint" id="scope"></p>
      </div>

      <div class="card">
        <div class="controls">
          <div class="field">
            <label for="q">氏名・ID・学籍番号・メールで検索</label>
            <input type="text" id="q" placeholder="例：山田 / S003 / Y24">
          </div>
          <div class="field">
            <label for="kind">区分</label>
            <select id="kind">
              <option value="student">学生スタッフ</option>
              <option value="staff">職員</option>
              <option value="all">全員</option>
            </select>
          </div>
          <div class="field">
            <label for="sort">並び順</label>
            <select id="sort">
              <option value="name">氏名</option>
              <option value="slots">空きコマが少ない順</option>
              <option value="courses">担当コマが多い順</option>
              <option value="updated">空きコマ更新が古い順</option>
            </select>
          </div>
        </div>
        <p class="count" id="count"></p>
      </div>

      <!-- 入学年度ごとに、1人1枚の箱を行列で並べる（D61） -->
      <div class="card">
        <div id="groups"></div>
      </div>

      <div id="orphans"></div>
      <p class="hint" id="foot"></p>
    </div>
  </main>

  <?!= include('shared-cache') ?>
  <script>
    var DATA = null;
    var OPEN_ID = '';       // 詳細を開いている人（1人だけ）
    var ISSUE_FILTER = '';  // サマリーのチップで絞り込んでいる issue コード（'*' は「要対応すべて」）

    // issue コード → 画面の文言。「何が起きるか」まで書く（項目名だけだと重さが伝わらない）
    var ISSUES = {
      contact:    { label: '連絡先DBに行が無い',   why: 'この人はログインできません。承認の途中で片側だけ作られた可能性があります。' },
      slots:      { label: '空きコマが未登録',     why: '対応する業務の空きコマが入っていません。その業務の代行依頼の候補に一度も出てきません。マイページから登録してもらってください。' },
      slotsStale: { label: '本人が更新していない', why: '空きコマは入っていますが、本人がマイページで出し直した記録がありません。学期が変わっていれば古い値のままです。' },
      webhook:    { label: '通知先URLが未登録',    why: '代行依頼の通知が届きません。マイページから登録してもらってください。' },
      phone:      { label: '電話番号が未登録',     why: '返信が無いときに職員から連絡できません。' }
    };

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function escapeAttr(s) {
      return escapeHtml(s).replace(/'/g, '&#39;').replace(/"/g, '&quot;');
    }
    function mark(ok, yesText, noText) {
      return ok ? '<span class="yes">' + yesText + '</span>'
                : '<span class="no">' + noText + '</span>';
    }

    // ── サマリー ────────────────────────────────────────────
    function renderSummary() {
      var s = DATA.summary;
      var chips = [];
      chips.push(chip('', 'total', '学生スタッフ ' + s.students + ' 人'));
      if (s.needsAction === 0) {
        chips.push('<span class="chip ok">全員そろっています</span>');
      } else {
        chips.push(chip('*', 'warn', '要対応 ' + s.needsAction + ' 人'));
      }
      chips.push(chip('slots', s.noSlots ? 'warn' : 'zero', '空きコマ未登録 ' + s.noSlots));
      chips.push(chip('slotsStale', s.slotsStale ? 'warn' : 'zero', '本人未更新 ' + s.slotsStale));
      chips.push(chip('webhook', s.noWebhook ? 'warn' : 'zero', '通知先なし ' + s.noWebhook));
      chips.push(chip('phone', s.noPhone ? 'warn' : 'zero', '電話なし ' + s.noPhone));
      if (s.noContact) chips.push(chip('contact', 'warn', 'ログイン不可 ' + s.noContact));
      document.getElementById('summary').innerHTML = chips.join('');

      document.getElementById('scope').innerHTML =
        '「担当コマ」は ' +
        (DATA.termScope.length ? escapeHtml(DATA.termScope.join('・')) : '（学期未設定）') +
        ' のコマ数です（終わった単発コマは数えません）。' +
        (DATA.pendingRegistrations
          ? ' 承認待ちの利用登録が <b>' + DATA.pendingRegistrations + ' 件</b>あります（' +
            '<a href="<?= appUrl ?>?page=approvals">利用登録の承認</a>）。'
          : '');
    }

    function chip(code, tone, text) {
      var on = (code && ISSUE_FILTER === code) ? ' on' : '';
      return '<button type="button" class="chip ' + tone + on + '" data-issue="' +
        escapeAttr(code) + '">' + escapeHtml(text) + '</button>';
    }

    // ── 一覧 ────────────────────────────────────────────────
    function visibleRows() {
      var kind = document.getElementById('kind').value;
      var q = document.getElementById('q').value.trim().toLowerCase();

      var rows = DATA.rows.filter(function (r) {
        if (kind === 'student' && !r.isStudent) return false;
        if (kind === 'staff' && r.isStudent) return false;
        if (ISSUE_FILTER === '*' && r.issues.length === 0) return false;
        if (ISSUE_FILTER && ISSUE_FILTER !== '*' && r.issues.indexOf(ISSUE_FILTER) === -1) return false;
        if (q) {
          var hay = (r.name + ' ' + r.staff_id + ' ' + r.studentNo + ' ' + r.email).toLowerCase();
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });

      var sort = document.getElementById('sort').value;
      if (sort === 'slots') {
        rows.sort(function (a, b) { return a.slotCount - b.slotCount; });
      } else if (sort === 'courses') {
        rows.sort(function (a, b) { return b.courseCount - a.courseCount; });
      } else if (sort === 'updated') {
        // 未更新（空文字）が一番古い扱いになり先頭に来る
        rows.sort(function (a, b) {
          return String(a.slots_updated_at).localeCompare(String(b.slots_updated_at));
        });
      }
      return rows;
    }

    function render() {
      renderSummary();
      var rows = visibleRows();
      var host = document.getElementById('groups');

      document.getElementById('count').textContent =
        rows.length + ' 人を表示中（登録済み 全 ' + DATA.summary.total + ' 人：学生 ' +
        DATA.summary.students + ' 人・職員 ' + DATA.summary.staffMembers + ' 人）';

      if (rows.length === 0) {
        host.innerHTML = '<p class="state">該当する人がいません。</p>';
      } else {
        host.innerHTML = groupsOf(rows).map(function (g) {
          var open = g.rows.filter(function (r) { return r.staff_id === OPEN_ID; })[0];
          return '<div class="ghead"><h3>' + escapeHtml(g.title) + '</h3><span class="n">' + g.rows.length + ' 人</span></div>' +
            '<div class="pgrid">' + g.rows.map(personCard).join('') + '</div>' + (open ? detailHtml(open) : '');
        }).join('');
      }
      renderOrphans();
      document.getElementById('foot').textContent = '最終取得: ' + DATA.generatedAt;
    }

    // 入学年度（メールの学籍番号の2桁）ごとにまとめる。古い年度から。読めない学生・職員は最後（D61）
    function groupsOf(rows) {
      var byKey = {};
      var keys = [];
      rows.forEach(function (r) {
        var key = !r.isStudent ? '~staff' : (r.entryYear ? r.entryYear : '~unknown');
        if (!byKey[key]) { byKey[key] = []; keys.push(key); }
        byKey[key].push(r);
      });
      keys.sort();
      return keys.map(function (k) {
        var title = k === '~staff' ? '職員'
          : k === '~unknown' ? '学籍番号が読めない学生'
          : k + '（20' + k + '年度入学）';
        return { title: title, rows: byKey[k] };
      });
    }

    function personCard(r) {
      // 「ログインできない」は他の欠けと重さが違うので赤、それ以外の欠けは黄色。学生で欠けが無ければ緑
      var cls = 'pc' + (r.issues.indexOf('contact') !== -1 ? ' blocked'
        : (r.issues.length ? ' attn' : (r.isStudent ? ' ok' : ''))) + (OPEN_ID === r.staff_id ? ' open' : '');
      var updated = r.slots_updated_at
        ? escapeHtml(r.slots_updated_at.slice(0, 10))
        : (r.isStudent ? '<span class="stale">未更新</span>' : '<span class="na">—</span>');
      var kv = function (k, v) { return '<span>' + k + '</span><span>' + v + '</span>'; };
      var body = '<div class="kv">' +
        kv('業務', escapeHtml(r.skills || '全対応')) +
        (r.isStudent ? kv('空きコマ', slotCells(r) + '<span class="na">（テイク/介助）</span>') : '') +
        (r.isStudent ? kv('更新', updated) : '') +
        kv('担当', r.courseCount + ' コマ') +
        kv('電話', (r.isStudent || r.phone) ? mark(!!r.phone, escapeHtml(r.phone), '未登録') : '<span class="na">—</span>') +
        (r.isStudent ? kv('通知', mark(r.hasWebhook, '届く', '届かない')) : '') +
        '</div>';
      return '<div class="' + cls + '" data-id="' + escapeAttr(r.staff_id) + '">' +
        '<div class="top"><span class="nm">' + escapeHtml(r.name || '（氏名なし）') + '</span>' +
          '<span class="sid">' + escapeHtml(r.studentNo || r.staff_id) + '</span>' +
          (r.isStudent ? '' : '<span class="role staff">' + escapeHtml(r.role || '職員') + '</span>') + '</div>' +
        body + '</div>';
    }

    // 業務ごとの空きコマ件数。対応しない業務は薄く、対応するのに0件なら赤で出す。
    function slotCells(r) {
      return (r.slotCounts || []).map(function (c) {
        if (!c.relevant) return '<span class="na">–</span>';
        return c.count ? String(c.count) : '<span class="no">0</span>';
      }).join('<span class="na"> / </span>');
    }

    function detailHtml(r) {
      var kv = function (k, v) {
        return '<dt>' + k + '</dt><dd' + (v ? '' : ' class="empty"') + '>' +
          (v ? escapeHtml(v) : '（未登録）') + '</dd>';
      };
      var slots = (DATA.supportTypes || []).map(function (type) {
        var list = (r.slotsByType && r.slotsByType[type]) || [];
        var body = list.length
          ? '<div class="slotlist">' + list.map(function (s) {
              return '<span class="slot">' + escapeHtml(s) + '</span>';
            }).join('') + '</div>'
          : '<span class="na">（未登録）</span>';
        return '<dt>空きコマ<small>' + escapeHtml(type) + '</small></dt><dd>' + body + '</dd>';
      }).join('');

      var todo = r.issues.length
        ? '<ul class="todo">' + r.issues.map(function (code) {
            var i = ISSUES[code] || { label: code, why: '' };
            return '<li><b>' + escapeHtml(i.label) + '</b> — ' + escapeHtml(i.why) + '</li>';
          }).join('') + '</ul>'
        : '<p class="hint">不足はありません。</p>';

      return '<div class="detail">' +
        '<div class="dhead"><b>' + escapeHtml(r.name || '（氏名なし）') + '</b>' +
          '<button type="button" class="btn sm" data-close="1">閉じる</button></div>' +
        '<dl class="dl">' +
          kv('スタッフID', r.staff_id) +
          kv('メール', r.email) +
          kv('電話番号', r.phone) +
          '<dt>通知先URL</dt><dd' + (r.hasWebhook ? '' : ' class="empty"') + '>' +
            (r.hasWebhook ? '登録あり（URL は表示しません）' : '（未登録・代行依頼が届きません）') +
          '</dd>' +
          slots +
          kv('空きコマ更新', r.slots_updated_at) +
        '</dl>' + todo +
        '<p class="hint">電話・通知先URL・空きコマ・対応業務は<b>本人がマイページから</b>直せます。' +
        '氏名と区分は<b>職員が名簿（staffs）で</b>直します。</p>' +
        '</div>';
    }

    function renderOrphans() {
      var host = document.getElementById('orphans');
      var list = DATA.orphanContacts || [];
      if (list.length === 0) { host.innerHTML = ''; return; }
      host.innerHTML = '<div class="notice warn"><b>名簿に対応する行が無い連絡先が ' + list.length +
        ' 件あります。</b><br>連絡先DBにはあるのに staffs に行が無い状態です。' +
        'この人はログインしても「利用登録がありません」になります。<br>' +
        list.map(function (c) {
          return '・' + escapeHtml(c.name || '（氏名なし）') + '（' +
            escapeHtml(c.email || 'メール未登録') + '／staff_id: ' +
            escapeHtml(c.staff_id || '空') + '）';
        }).join('<br>') + '</div>';
    }

    // ── 操作 ────────────────────────────────────────────────
    // 箱を押すと、そのまとまりの下に詳細を開く（もう一度押すか「閉じる」で閉じる。開くのは1人だけ）
    document.getElementById('groups').addEventListener('click', function (ev) {
      if (ev.target.closest('[data-close]')) { OPEN_ID = ''; render(); return; }
      var box = ev.target.closest('.pc');
      if (!box) return;
      var id = box.getAttribute('data-id');
      OPEN_ID = OPEN_ID === id ? '' : id;
      render();
      // 詳細はまとまりの下に出るので、押した箱から離れていても見えるところまで送る（スマホは1列で長い）
      var d = OPEN_ID && document.querySelector('#groups .detail');
      if (d) d.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    document.getElementById('summary').addEventListener('click', function (ev) {
      var btn = ev.target.closest('button[data-issue]');
      if (!btn) return;
      var code = btn.getAttribute('data-issue');
      // 「学生スタッフ N 人」（code なし）は絞り込み解除。同じチップの再押下でも解除する。
      ISSUE_FILTER = (!code || ISSUE_FILTER === code) ? '' : code;
      if (ISSUE_FILTER) document.getElementById('kind').value = 'student';
      render();
    });

    ['q', 'kind', 'sort'].forEach(function (id) {
      var el = document.getElementById(id);
      el.addEventListener('input', render);
      el.addEventListener('change', render);
    });

    // 同じタブで再び開いたときは前回の名簿を先に出す（D49）。読み取り専用なので操作は止めない。
    function load() {
      viewCacheLoad({
        owner: '<?= user.staff_id ?>',
        key: 'getStaffRoster',
        rootId: 'body',
        run: function (ok, ng) {
          google.script.run.withSuccessHandler(ok).withFailureHandler(ng).getStaffRoster();
        },
        render: function (data) {
          DATA = data;
          document.getElementById('top').hidden = true;
          document.getElementById('body').hidden = false;
          render();
        },
        onError: function (err) {
          var top = document.getElementById('top');
          top.className = 'state';
          top.textContent = 'エラー: ' + err.message;
        },
      });
    }

    load();
  </script>
</body>
</html>
